      - best_effort
    SigningRecordPolicyRequestDto:
      type: object
      description: Per-profile policy for what to record about each signing operation
      properties:
        recordingEnabled:
          type: boolean
          default: true
          description: "Master switch: when false, no Signing Record is created at\
            \ all for this profile, regardless of the content policy below. When true,\
            \ a record is always created (capturing the content selected below, or\
            \ metadata-only if none is selected)."
        recordRequestMetadata:
          type: boolean
          description: "Content policy: capture inbound request parameters (algorithm,\
            \ policy IDs, claimed signer)"
        recordSignature:
          type: boolean
          description: "Content policy: capture raw signature value"
        recordSignedDocument:
          type: boolean
          description: "Content policy: capture assembled signed document (only valid\
            \ for CONTENT_SIGNING and TIMESTAMPING workflows)"
        recordDtbs:
          type: boolean
          description: "Content policy: capture data-to-be-signed bytes"
        retentionDays:
          type: integer
          format: int32
          description: Retention in days. null = retain indefinitely. Minimum is 1
            day.
          minimum: 1
        deleteAfterRetrieval:
          type: boolean
          description: Delete the signed document after CSC API async retrieval succeeds
        persistenceMode:
          $ref: "#/components/schemas/SigningRecordPersistenceMode"
          default: deferred_durable
          description: Persistence-mode trade-off between latency and durability
