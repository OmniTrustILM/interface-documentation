          $ref: "#/components/schemas/SigningWorkflowType"
          description: Signing workflow type
          examples:
          - timestamping
        signatureFormattingConnector:
          $ref: "#/components/schemas/NameAndUuidDto"
          description: Signature Formatting Provider that constructs the data-to-be-signed
            (DTBS) for Content signing. Present only when ILM-managed signing is used;
            null for delegated signing.
        signatureFormattingConnectorAttributes:
          type: array
          description: Attributes configured on the Signature Formatting Provider
            that control DTBS construction for the content signing workflow. Applicable
            only when ILM-managed signing is used.
          items:
            $ref: "#/components/schemas/ResponseAttribute"
        family:
          $ref: "#/components/schemas/SignatureFamily"
          description: Signature family this profile produces. Present only when ILM-managed
            signing is used; null for delegated signing.
        maxLevel:
          $ref: "#/components/schemas/SignatureLevel"
          description: Highest signature level a request may ask for. A request asking
            for more is rejected. Present only when ILM-managed signing is used; null
            for delegated signing.
        timestampSource:
          $ref: "#/components/schemas/TimestampSourceDto"
          description: Source of the timestamps embedded at level TIMESTAMPED and
            above. Set when maxLevel is TIMESTAMPED or higher.
        documentSizeCap:
          type: integer
          format: int64
          description: "Largest document accepted for signing, in bytes. Enforced\
            \ when an ILM-managed signing request arrives. Null when no profile-level\
            \ cap applies."
