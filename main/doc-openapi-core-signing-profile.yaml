          type: string
          description: Object identifier
          examples:
          - 7b55ge1c-844f-11dc-a8a3-0242ac120002
        name:
          type: string
          description: Object Name
          examples:
          - Name
        signingProfile:
          $ref: "#/components/schemas/SigningProfileListDto"
          description: Signing Profile used to produce this Signing Record
        protocol:
          $ref: "#/components/schemas/SigningProtocol"
          description: Signing protocol used to produce this Signing Record
        signingTime:
          type: string
          format: date-time
          description: Claimed signing time embedded in the signature structure by
            the signing operation.
        createdAt:
          type: string
          format: date-time
          description: Server time at which the Signing Record was created in the
            system. This timestamp is set by the platform and is independent of the
            cryptographic signing time.
        timestampTokenSerialNumbers:
          type: array
          description: "Serial numbers of the timestamp tokens this operation traces\
            \ to: for a content signature the tokens embedded in the signature, for\
            \ a timestamp record its own serial number. The protocol field tells the\
            \ two apart. Unpadded lower-case hex, no 0x prefix and no leading zeros.\
            \ Empty when the operation embedded no timestamp token, as a content signature\
            \ at level SIGNED does."
          example:
          - 2a
          items:
            type: string
        attributeValues:
          type: object
          additionalProperties:
            type: object
            additionalProperties:
              type: array
              items:
                $ref: "#/components/schemas/BaseAttributeContentDtoV3"
          description: "Values of the attribute-sourced fields requested as columns,\
            \ keyed by field source and then by field identifier. Present only when\
            \ the listing request asked for attribute-sourced columns; a field the\
            \ object has no value for is absent rather than empty, and a multi-valued\
            \ attribute arrives in its stored item_order."
