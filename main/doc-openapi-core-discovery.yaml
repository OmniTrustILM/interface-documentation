  /v1/discoveries/{connectorUuid}/{resource}/attributes:
    get:
      tags:
      - Discovery Management
      summary: Get per-resource Discovery Attributes from a Discovery Provider
      description: Relays the attribute definitions that refine discovery of one resource
        type from the Connector's discovery interface.
      operationId: getDiscoveryResourceAttributes
      parameters:
      - name: connectorUuid
        in: path
        description: Discovery Provider Connector UUID
        required: true
        schema:
          type: string
      - name: resource
        in: path
        description: "Resource type, identified by its wire code (e.g. \"certificates\"\
          , \"keys\")"
        required: true
        schema:
          $ref: "#/components/schemas/Resource"
      responses:
        "200":
          description: Per-resource Discovery Attributes received
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/BaseAttributeDto"
        "404":
          description: Connector not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessageDto"
        "422":
          description: "Resource is not discoverable by this Connector, or the Connector\
            \ does not implement the v2 discovery interface"
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
              example:
              - Error Message 1
              - Error Message 2
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessageDto"
        "401":
          description: Unauthorized
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
