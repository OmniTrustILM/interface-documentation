      - CertificateAuth: []
      - BearerJWTAuth: []
  /v1/discoveries/{uuid}/resume:
    patch:
      tags:
      - Discovery Management
      summary: Resume Discovery
      description: "Asks the Discovery Provider to continue a stopped run from its\
        \ checkpoint. Legal only from the stopped status. A Provider that has since\
        \ lost the checkpoint fails the run instead of restarting it, so a resume\
        \ is never silently a fresh scan."
      operationId: resumeDiscovery
      parameters:
      - name: uuid
        in: path
        description: Discovery UUID
        required: true
        schema:
          type: string
      responses:
        "204":
          description: Discovery resumed
        "404":
          description: Discovery not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessageDto"
        "422":
          description: "Discovery is not stopped, or its Discovery Provider does not\
            \ support resuming a run"
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
              example:
              - Error Message 1
              - Error Message 2
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessageDto"
        "401":
          description: Unauthorized
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthenticationServiceExceptionDto"
        "500":
          description: Internal Server Error
        "502":
          description: Connector Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessageDto"
        "503":
          description: Connector Communication Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessageDto"
      security:
      - SessionAuth: []
      - CertificateAuth: []
      - BearerJWTAuth: []
  /v1/discoveries/{uuid}/cancel:
    patch:
      tags:
      - Discovery Management
      summary: Cancel Discovery
      description: "Abandons a run for good: the Discovery Provider releases it and\
        \ the items already staged are never processed. Legal while the run is in\
        \ progress or stopped. This is irreversible - a cancelled run cannot be resumed."
      operationId: cancelDiscovery
      parameters:
      - name: uuid
        in: path
        description: Discovery UUID
        required: true
        schema:
          type: string
      responses:
        "204":
          description: Discovery cancelled
        "404":
          description: Discovery not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessageDto"
        "422":
          description: "Discovery is neither in progress nor stopped, or its Discovery\
            \ Provider does not support cancelling a run"
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
              example:
              - Error Message 1
              - Error Message 2
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessageDto"
        "401":
          description: Unauthorized
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthenticationServiceExceptionDto"
        "500":
          description: Internal Server Error
        "502":
          description: Connector Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessageDto"
        "503":
          description: Connector Communication Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessageDto"
