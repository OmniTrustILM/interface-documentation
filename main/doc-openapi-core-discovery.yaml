          type: array
          description: Metadata of the Discovery
          items:
            $ref: "#/components/schemas/MetadataResponseDto"
        triggers:
          type: array
          description: List of associated triggers
          items:
            $ref: "#/components/schemas/TriggerDto"
        resources:
          type: array
          description: "Resource types this run targets, as resource wire codes (e.g.\
            \ \"certificates\", \"keys\"). Always present: a run against a v1 connector\
            \ reports [\"certificates\"], synthesized by Core, so a client never inspects\
            \ the connector to learn what a run was after."
          items:
            $ref: "#/components/schemas/Resource"
        progress:
          $ref: "#/components/schemas/DiscoveryProgressDto"
        runMessageCount:
          type: integer
          format: int64
          description: "How many distinct advisory messages this run collected, as\
            \ counted by the run messages listing. Repeated problems are aggregated,\
            \ so this counts kinds of problem rather than occurrences. A non-zero\
            \ count does not imply the run failed. Always 0 for runs against a v1\
            \ Discovery Provider."
        stoppable:
          type: boolean
          description: "Whether this run can be stopped and later resumed. Always\
            \ present; false for runs against v1 connectors. This flag says whether\
            \ the run has the capability; the run status decides which control is\
            \ currently valid (stop while in progress, resume while stopped). The\
            \ connector may still refuse a stop at runtime past the point of no return."
      required:
      - attributes
      - connectorName
      - connectorStatus
      - connectorUuid
      - kind
      - name
      - runMessageCount
      - status
      - stoppable
      - triggers
      - uuid
    DiscoveryProgressDto:
      type: object
      description: "Run-level progress of a discovery run: the run-wide counters,\
        \ plus an optional per-resource breakdown."
      properties:
        processed:
          type: integer
          format: int64
          description: Number of items processed so far; omitted when the connector
            cannot report it
        totalEstimate:
          type: integer
          format: int64
          description: Estimated total number of items for the run; omitted when the
            connector cannot produce an estimate
        phase:
          type: string
          description: "Connector-defined free-text phase label (e.g. \"scanning\"\
            , \"enumerating\"); omitted when the connector has no phase concept"
        byResource:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/DiscoveryResourceProgressDto"
          propertyNames:
            $ref: "#/components/schemas/Resource"
    DiscoveryResourceProgressDto:
      type: object
      description: "Progress counters. Used for a whole run and, keyed by resource\
        \ code inside byResource (e.g. \"certificates\", \"keys\"), for one resource\
        \ type at a time. Every field is optional."
      properties:
        processed:
          type: integer
          format: int64
          description: Number of items processed so far; omitted when the connector
            cannot report it
        totalEstimate:
          type: integer
          format: int64
          description: Estimated total number of items for the run; omitted when the
            connector cannot produce an estimate
        phase:
          type: string
          description: "Connector-defined free-text phase label (e.g. \"scanning\"\
            , \"enumerating\"); omitted when the connector has no phase concept"
    MetadataResponseDto:
