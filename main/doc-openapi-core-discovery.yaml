        "500":
          description: Internal Server Error
        "502":
          description: Connector Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessageDto"
        "503":
          description: Connector Communication Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessageDto"
      security:
      - SessionAuth: []
      - CertificateAuth: []
      - BearerJWTAuth: []
  /v1/discoveries/{uuid}/items:
    get:
      tags:
      - Discovery Management
      summary: List Discovered Items
      description: "Returns one page of the items this Discovery staged, ordered by\
        \ their run sequence, optionally narrowed to a single resource type. Certificates\
        \ are included: a run against a v1 Discovery Provider stages certificates\
        \ only, so its unfiltered listing contains exactly what the certificate listing\
        \ contains, with sequence and uniqueRef synthesized by the platform (staging\
        \ order and certificate fingerprint) because a v1 provider never numbered\
        \ its items."
      operationId: getDiscoveryItems
      parameters:
      - name: uuid
        in: path
        description: Discovery UUID
        required: true
        schema:
          type: string
      - name: resource
        in: query
        description: "Resource type to list, identified by its wire code (e.g. \"\
          certificates\", \"keys\"); omit to list every resource type this run discovered"
        required: false
        schema:
          $ref: "#/components/schemas/Resource"
      - name: newlyDiscovered
        in: query
        required: false
        schema:
          type: boolean
      - name: itemsPerPage
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 10
      - name: pageNumber
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 0
      responses:
        "200":
          description: Discovered items retrieved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginationResponseDtoDiscoveryItemDto"
        "404":
          description: Discovery not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessageDto"
        "400":
          description: Bad Request
          content:
            application/json:
