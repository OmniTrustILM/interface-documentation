    DiscoveryMessageDto:
      type: object
      description: "One kind of problem a Discovery run reported, with how often it\
        \ happened. Repeats aggregate onto the entry already carrying them rather\
        \ than adding a new one."
      properties:
        severity:
          $ref: "#/components/schemas/DiscoveryMessageSeverity"
        code:
          type: string
          description: "Identifier for the kind of problem, from a closed vocabulary\
            \ — what an operator or a support engineer matches on. Entries are aggregated\
            \ by code together with the message text, so several entries in one run\
            \ may share a code."
          maxLength: 64
        message:
          type: string
          description: "Human-readable description of the problem. Curated text written\
            \ for a person to read; never a raw exception message, and never text\
            \ a Discovery Provider authored."
        occurrences:
          type: integer
          format: int64
          description: How many times this problem occurred during the run. At least
            1.
          minimum: 1
        firstSeenAt:
          type: string
          format: date-time
          description: When this problem was first seen during the run.
        lastSeenAt:
          type: string
          format: date-time
          description: When this problem was most recently seen during the run.
      required:
      - code
      - firstSeenAt
      - lastSeenAt
      - message
      - occurrences
      - severity
    DiscoveryMessageSeverity:
      type: string
      enum:
      - info
      - warning
      - error
    PaginationResponseDtoDiscoveryMessageDto:
      type: object
      properties:
        items:
          type: array
          description: Items returned
          items:
            $ref: "#/components/schemas/DiscoveryMessageDto"
        itemsPerPage:
          type: integer
          format: int32
          description: Number of entries per page
        pageNumber:
          type: integer
          format: int32
          description: Page number for the request
        totalPages:
          type: integer
          format: int32
          description: Number of pages available
        totalItems:
          type: integer
          format: int64
          description: Number of items available
      required:
      - items
      - itemsPerPage
      - pageNumber
      - totalItems
      - totalPages
    DiscoveredCertificateDto:
      allOf:
      - $ref: "#/components/schemas/DiscoveredItemPayload"
      - type: object
        properties:
          certificateData:
            type: string
            description: Base64-encoded certificate data (DER)
            minLength: 1
      required:
      - certificateData
      - resource
    DiscoveredItemPayload:
      type: object
      description: "Resource-specific payload of a discovered item. The required resource\
        \ property is the discriminator: it carries the resource's wire code and selects\
        \ which concrete payload shape this object is. Each concrete shape fixes it\
        \ to its own value."
      discriminator:
        propertyName: resource
        mapping:
          certificates: "#/components/schemas/DiscoveredCertificateDto"
          keys: "#/components/schemas/DiscoveredKeyDto"
      oneOf:
      - $ref: "#/components/schemas/DiscoveredCertificateDto"
      - $ref: "#/components/schemas/DiscoveredKeyDto"
      properties:
        resource:
          $ref: "#/components/schemas/Resource"
    DiscoveredKeyDto:
      allOf:
      - $ref: "#/components/schemas/DiscoveredItemPayload"
      - type: object
        properties:
          type:
            $ref: "#/components/schemas/KeyType"
            description: "Key type: whether this is a public, private, secret, or\
              \ split key"
          algorithm:
            $ref: "#/components/schemas/KeyAlgorithm"
            description: Cryptographic algorithm of the key
          length:
            type: integer
            format: int32
            description: Key length in bits
          fingerprint:
            type: string
            description: "Intrinsic key fingerprint; correlates the same key across\
              \ runs, connectors, and certificates without exposing key material"
          publicKeyFormat:
            $ref: "#/components/schemas/KeyFormat"
            description: Format of publicKey when present (typically SubjectPublicKeyInfo);
              absent when publicKey is absent
          publicKey:
            type: string
            description: "Base64-encoded public key material. Absent for PRIVATE_KEY,\
              \ SECRET_KEY or SPLIT_KEY discoveries, where only existence and intrinsic\
              \ metadata are ever reported"
      description: "A connector reports a key's existence, intrinsic metadata, and\
        \ at most its public part; private, secret and split key material must never\
        \ be sent. A PRIVATE_KEY, SECRET_KEY or SPLIT_KEY report MUST omit publicKey\
        \ and publicKeyFormat entirely."
      required:
      - algorithm
      - resource
      - type
    DiscoveryItemDto:
      type: object
      properties:
        uuid:
          type: string
          description: UUID of the staged Discovery item
        inventoryUuid:
          type: string
          description: "UUID of the object this item became in inventory. Absent until\
            \ the item is processed, and absent permanently if its processing failed."
        sequence:
          type: integer
          format: int64
          description: "Position of this item in the run. For runs against a v2 Discovery\
            \ Provider this is the provider's run-wide sequence; for runs against\
            \ a v1 provider, which never numbered its items, Core synthesizes it from\
            \ staging order."
        uniqueRef:
          type: string
          description: "Reference identifying this item within the run, unique per\
            \ resource type. Provider-assigned for v2-staged items; for certificates\
            \ staged by a v1 provider Core uses the certificate fingerprint, which\
            \ is the identity it deduplicates on."
        discoveredAt:
          type: string
          format: date-time
          description: When the Discovery Provider reported discovering this item
        payload:
          $ref: "#/components/schemas/DiscoveredItemPayload"
          description: "Resource-specific data the Discovery Provider reported, discriminated\
            \ by resource"
        newlyDiscovered:
          type: boolean
          description: "True when the object was not already in the inventory at the\
            \ time this run staged it, false when the run rediscovered something the\
            \ inventory already held."
        processed:
          type: boolean
          description: Indicator whether processing of the staged item has been attempted;
            processedError and inventoryUuid convey the outcome.
        processedError:
          type: string
          description: "Reason recorded against this item, if any — not only a failure,\
            \ and not tied to processed. An item that was handled can carry one, and\
            \ an item that was never attempted carries one while processed stays false."
        meta:
          type: array
          description: Item metadata as reported by the Discovery Provider — where
            the item was found (e.g. IP address and port). Absent when the provider
            reported none.
          items:
            $ref: "#/components/schemas/MetadataAttribute"
        resource:
          $ref: "#/components/schemas/Resource"
          readOnly: true
      required:
      - newlyDiscovered
      - payload
      - processed
      - resource
      - sequence
      - uniqueRef
      - uuid
    KeyAlgorithm:
      type: string
      enum:
      - RSA
      - ECDSA
      - FALCON
      - ML-DSA
      - SLH-DSA
      - ML-KEM
      - CRYSTALS-Dilithium
      - SPHINCS+
      - Unknown
    KeyFormat:
      type: string
      enum:
