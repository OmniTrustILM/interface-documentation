  /v1/discoveries/{uuid}/messages:
    get:
      tags:
      - Discovery Management
      summary: List Discovery Run Messages
      description: "Returns one page of the advisory messages a Discovery run collected,\
        \ oldest first and stable across pages. Repeated problems are aggregated into\
        \ a single entry carrying an occurrence count rather than repeated per occurrence.\
        \ Messages are advisory: collecting them does not imply the run failed."
      operationId: getDiscoveryRunMessages
      parameters:
      - name: uuid
        in: path
        description: Discovery UUID
        required: true
        schema:
          type: string
      - name: itemsPerPage
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 10
      - name: pageNumber
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 0
      responses:
        "200":
          description: Discovery run messages retrieved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginationResponseDtoDiscoveryMessageDto"
        "404":
          description: Discovery not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessageDto"
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
