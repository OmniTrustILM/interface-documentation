          type: boolean
          default: false
          description: True to replace renewed certificate in the associated locations
        request:
          type: string
          description: "Certificate signing request encoded as Base64 string. If not\
            \ provided, Existing CSR will be used"
        format:
          $ref: "#/components/schemas/CertificateRequestFormat"
          default: pkcs10
          description: Certificate signing request format
        attributes:
          type: array
          description: "Renew-specific dynamic attributes, as listed by GET /v2/operations/authorities/{authorityUuid}/raProfiles/{raProfileUuid}/attributes/renew.\
            \ Optional — an authority that offers no renew schema needs none."
          items:
            $ref: "#/components/schemas/RequestAttribute"
        authorizationSecret:
          type: string
          description: One-time authorization secret for renewing a certificate that
            has an active registration. Write-only; ignored for certificates without
            one.
          writeOnly: true
    ClientCertificateRekeyRequestDto:
      type: object
      properties:
        replaceInLocations:
          type: boolean
          default: false
          description: True to replace renewed certificate in the associated locations
        request:
          type: string
          description: "Certificate signing request encoded as Base64 string. If not\
            \ provided, CSR attributes will be used"
        format:
          $ref: "#/components/schemas/CertificateRequestFormat"
          default: pkcs10
          description: Certificate signing request format
        keyUuid:
          type: string
          format: uuid
          description: Key UUID
        tokenProfileUuid:
          type: string
          format: uuid
          description: Token Profile UUID
        altKeyUuid:
          type: string
          format: uuid
          description: Alternative Key UUID
        altTokenProfileUuid:
          type: string
          format: uuid
          description: Token Profile UUID for the alternative key
        signatureAttributes:
          type: array
          description: "Signature Attributes. If not provided, existing attributes\
            \ will be used to generate the new CSR"
          items:
            $ref: "#/components/schemas/RequestAttribute"
        altSignatureAttributes:
          type: array
          description: "Alternative Signature Attributes. If not provided, existing\
            \ alternative attributes will be used to generate the new CSR"
          items:
            $ref: "#/components/schemas/RequestAttribute"
        attributes:
          type: array
          description: "Rekey dynamic attributes. Rekey is a renew at the authority\
            \ — there is no separate rekey operation on the connector contract — so\
            \ this uses the renew schema, as listed by GET /v2/operations/authorities/{authorityUuid}/raProfiles/{raProfileUuid}/attributes/renew.\
            \ Distinct from signatureAttributes/altSignatureAttributes, which configure\
            \ CSR signing, not the CA operation."
          items:
            $ref: "#/components/schemas/RequestAttribute"
        authorizationSecret:
          type: string
          description: One-time authorization secret for rekeying a certificate that
            has an active registration. Write-only; ignored for certificates without
            one.
          writeOnly: true
