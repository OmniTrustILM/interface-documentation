tags:
- name: Content Signing Formatting
  description: |-
    Formatting of content signatures in the families a connector declares. Every content-signing formatting connector implements this contract and advertises the contentSigningFormatting interface on /v2/info. Its declaration route lists the families it serves. It MUST reject any other family with 422 (errorCode `PARAMETER_UNSUPPORTED`).

    The ladder operations form three compute/embed pairs plus the fused extendToLevel. A pair exists wherever the connector needs something only the platform can produce. That is a signature value, because private keys never leave the platform. It is also a timestamp token, because timestamps are issued platform-side. Validation material is deliberately not such an artifact. The connector fetches it itself, inside extendToLevel, where the document already is.

    The connector MUST be stateless. It holds nothing between operations. Every request carries everything that operation needs. The only value that crosses from a compute step to its embed step is formattingContext. The connector produces it, and the platform replays it verbatim without inspecting or storing it. The connector MUST NOT run timers or background jobs of its own. Any periodic work is a call the platform makes.

    The six pure-compute operations MUST be deterministic. An identical request MUST produce a bit-identical result across connector replicas and versions. The platform relies on this: it resumes an interrupted signing operation by replaying the operation sequence, rather than by storing what each step returned. extendToLevel is the exception. It fetches, so its retry semantics are refetch, not replay.

    The connector MUST NOT read its own clock for anything that enters signature content. The platform supplies signingTime, and the connector uses that value.

    Every ladder operation has an attribute schema that configures it, read from that operation's route plus /attributes. It lists profile attributes and request attributes. The platform collects those schemas when a Signing Profile is configured and replays the operator's values in formattingAttributes on every call; computeDtbs also receives the signing request's values in requestAttributes. The platform sends the operator's values to validateProfile before it saves a profile. The connector judges them there as a whole.

    A Signing Profile holds one flat set of attribute values, not one set per operation. The platform merges the schemas of every operation that profile can reach into a single set, keyed by attribute name. It sends that whole set to every operation. Which operations are reachable depends on the level the profile is configured up to.

    Two consequences bind a connector. First, a ladder operation MUST ignore any attribute name its own schema does not declare, rather than rejecting it: that name belongs to a sibling operation. The platform has already refused, at profile save, any name no reachable operation declares. Second, an attribute declared by more than one operation MUST carry an identical definition in every schema that lists it. The operator configures it once, and both operations receive that one value. For the compute/embed twins that is the point rather than a limitation. An imprint computed under one digest algorithm must be embedded expecting the same one, and a single shared attribute makes that true by construction.
- name: Metrics API
  description: Connector metrics API. Connector metrics API is exposing standard Prometheus/OpenMetrics
    metrics that can be scraped by observability solutions and collectors.
- name: Connector Attributes v2
  description: Attribute-definition registry and stateless callback surface for NG
    connectors.
- name: Health check v2
  description: "Connector Health check API. Connector returns own status and in some\
    \ cases can return status of components on which it depends like database, HSM\
    \ and so on."
- name: Connector Info v2
  description: "Connector Information API. Each connector may have multiple functions\
    \ represented by its connector interfaces. For each connector interface there\
    \ is a list of implemented endpoints. These endpoints must be according the specified\
    \ interface, this is validated by the core. You can also implement helper end\
    \ points that are used for callbacks and other relevant operations specific to\
    \ implementation."
paths:
  /v2/attributes/callback:
    post:
      tags:
      - Connector Attributes v2
      summary: Execute an attribute callback
      description: "Resolves dynamic attribute content for the attribute identified\
        \ in the request, using the supplied scope and current attribute values."
      operationId: callback
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AttributeCallbackRequestDto"
        required: true
      responses:
        "200":
          description: Callback executed successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AttributeCallbackResponseDto"
        "404":
          description: Not Found. Endpoint not found or not implemented
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetailExtended"
        "422":
          description: Callback request failed validation at the connector
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetailExtended"
        "401":
          description: Unauthorized
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetailExtended"
        "500":
          description: Internal Server Error
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetailExtended"
      security:
      - ConnectorAPIKeyAuth: []
      - CertificateTLSAuth: []
      - NoAuth: []
      - BasicAuth: []
  /v1/signatureProvider/contentSigning/validateProfile:
    post:
      tags:
      - Content Signing Formatting
      summary: Validate a Signing Profile
      description: |-
        Returns the connector's judgement of a Signing Profile's attribute values taken as a whole: the problems it finds, each naming one attribute, and the document transfer modes the values allow. The platform calls it before it saves a profile and refuses the save while any error remains. It stores the transfer modes with the profile and holds every signing request under that profile to them.

        `allowedRequestAttributes` names what a signing request may set, so the connector can tell a value the profile leaves to the request from one no request can supply. The connector MUST answer a profile it cannot use with errors in a 200, keeping 422 for a request it cannot process, and every transfer mode it names MUST be among the transfer modes the family declares.
      operationId: validateContentSigningProfile
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ValidateProfileRequest"
        required: true
      responses:
        "200":
          description: Profile judged; `errors` lists its problems and is empty for
            a valid profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidateProfileResponse"
        "400":
          description: Request body cannot be read (errorCode BAD_REQUEST)
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetailExtended"
        "422":
          description: |-
            - `PARAMETER_UNSUPPORTED` — the requested family is unsupported by the connector.
            - `VALIDATION_FAILED` — the body is readable but breaks a field rule, such as an absent or malformed family or an absent `allowedRequestAttributes`.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetailExtended"
        "401":
          description: Unauthorized
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetailExtended"
        "404":
          description: Not Found. Endpoint not found or not implemented
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetailExtended"
        "500":
          description: Internal Server Error
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetailExtended"
      security:
      - ConnectorAPIKeyAuth: []
      - CertificateTLSAuth: []
      - NoAuth: []
      - BasicAuth: []
  /v1/signatureProvider/contentSigning/extendToLevel:
    post:
      tags:
      - Content Signing Formatting
      summary: Extend the signature to a higher level
      description: |-
        Fetches the validation material the signature needs and embeds it in the same call. That material is CRLs, OCSP responses, and any certificates missing from the chain. Embedding it raises the signature to LONG_TERM, so it stays verifiable after the signing certificate expires.

        This is the one operation that reaches the network on its own, and it MUST run on a deployment allowed that egress. It is correspondingly the one operation exempt from the determinism rule. It fetches, so a retry refetches rather than replays. Two runs may legitimately embed different material. Its response reports every artifact fetched, because that manifest is the platform's only account of traffic it did not make itself.

        certificateChain.trustAnchors tells the connector where a chain stops. That is what decides whether revocation data is demanded for that certificate. The platform may send it empty. No certificate is then designated an anchor, and the connector treats every one of them as untrusted.

        The operation carries an execution-mode envelope for a future asynchronous path. The platform always sends SYNCHRONOUS today, and treats a 202 as a contract violation. The capability flag that will gate the asynchronous path is not published yet. A connector that does not declare LONG_TERM for the family does not implement this operation at all.
      operationId: extendToLevel
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExtendToLevelRequest"
        required: true
      responses:
        "200":
          description: Material fetched and embedded synchronously; the signed document
            is at LONG_TERM level and the fetch manifest accompanies it
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExtendToLevelResponse"
        "202":
          description: Extension accepted asynchronously; the body carries the tracking
            handle and no document
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExtendToLevelResponse"
        "400":
          description: Request body cannot be read (errorCode BAD_REQUEST)
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetailExtended"
        "422":
          description: |-
            - `PARAMETER_UNSUPPORTED` — the requested family or the target level is unsupported by the connector, or the connector does not declare LONG_TERM for the family and so does not implement the extension.
            - `SIGNATURE_NOT_FOUND` — the document carries no signature to extend.
            - `DOCUMENT_MALFORMED` — the document cannot be parsed.
            - `VALIDATION_FAILED` — the body is readable but breaks a field rule, such as an absent or malformed family or an absent chain.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetailExtended"
        "401":
          description: Unauthorized
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetailExtended"
        "404":
          description: Not Found. Endpoint not found or not implemented
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetailExtended"
        "500":
          description: Internal Server Error
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetailExtended"
      security:
      - ConnectorAPIKeyAuth: []
      - CertificateTLSAuth: []
      - NoAuth: []
      - BasicAuth: []
  /v1/signatureProvider/contentSigning/extendToLevel/status:
    post:
      tags:
      - Content Signing Formatting
      summary: Get the status of an asynchronous extension
      description: "Reports where an asynchronous extension stands, and carries its\
        \ result once it has completed. A connector that runs the extension synchronously\
        \ mints no tracking handle. It therefore answers 404 to every call here —\
        \ truthfully, rather than through a stub."
      operationId: getExtendToLevelStatus
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExtendOperationScopedRequest"
        required: true
      responses:
        "200":
          description: Extension status retrieved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExtendOperationStatusResponse"
        "400":
          description: Request body cannot be read (errorCode BAD_REQUEST)
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetailExtended"
        "404":
          description: Not Found. Endpoint not found or not implemented
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetailExtended"
        "422":
          description: "The body is readable but breaks a field rule, such as an absent\
            \ or malformed family or an absent tracking handle (errorCode VALIDATION_FAILED)"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetailExtended"
        "401":
          description: Unauthorized
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetailExtended"
        "500":
          description: Internal Server Error
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetailExtended"
      security:
      - ConnectorAPIKeyAuth: []
      - CertificateTLSAuth: []
      - NoAuth: []
      - BasicAuth: []
  /v1/signatureProvider/contentSigning/extendToLevel/cancel:
    post:
      tags:
      - Content Signing Formatting
      summary: Cancel an asynchronous extension
      description: Abandons an extension that is still in flight. A connector that
        runs the extension synchronously mints no tracking handle and therefore answers
        404 to every call here.
      operationId: cancelExtendToLevel
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExtendOperationScopedRequest"
        required: true
      responses:
        "204":
          description: Aborted
        "400":
          description: Request body cannot be read (errorCode BAD_REQUEST)
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetailExtended"
        "404":
          description: Not Found. Endpoint not found or not implemented
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetailExtended"
        "422":
          description: |-
            - The operation is already terminal, or past the point of no return.
            - `VALIDATION_FAILED` — the body is readable but breaks a field rule, such as an absent or malformed family or an absent tracking handle.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetailExtended"
        "401":
          description: Unauthorized
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetailExtended"
        "500":
          description: Internal Server Error
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetailExtended"
      security:
      - ConnectorAPIKeyAuth: []
      - CertificateTLSAuth: []
      - NoAuth: []
      - BasicAuth: []
  /v1/signatureProvider/contentSigning/embedSignatureValue:
    post:
      tags:
      - Content Signing Formatting
      summary: Embed the signature value
      description: |-
        Completes a SIGNED-level signature by embedding the signature value the platform's signer produced over the data-to-be-signed bytes. The formattingContext returned by computeDtbs is replayed here unchanged. The connector MUST NOT expect to have kept any state of its own between the two calls.

        **Signature algorithm.** signatureAlgorithm is the same value the platform gave computeDtbs. The connector MUST embed the value as a signature under that algorithm, and MUST refuse a request whose algorithm disagrees with the one its formattingContext committed to, answering 422 with errorCode CONTEXT_MISMATCH. That turns compute-to-embed drift into one diagnosable error rather than a structurally valid signature no validator accepts.
      operationId: embedSignatureValue
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmbedSignatureValueRequest"
        required: true
      responses:
        "200":
          description: Signature value embedded; the signed document is at SIGNED
            level
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SignedDocumentResponse"
        "400":
          description: Request body cannot be read (errorCode BAD_REQUEST)
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetailExtended"
        "422":
          description: |-
            - `DOCUMENT_MALFORMED` — the replayed formattingContext cannot be interpreted.
            - `PARAMETER_UNSUPPORTED` — the requested family or the signatureAlgorithm is unsupported by the connector.
            - `CONTEXT_MISMATCH` — the request contradicts the formattingContext it replays, such as a signatureAlgorithm that disagrees with the one that context committed to.
            - `VALIDATION_FAILED` — the body is readable but breaks a field rule, such as an absent or malformed family.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetailExtended"
        "401":
          description: Unauthorized
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetailExtended"
        "404":
          description: Not Found. Endpoint not found or not implemented
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetailExtended"
        "500":
          description: Internal Server Error
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetailExtended"
      security:
      - ConnectorAPIKeyAuth: []
      - CertificateTLSAuth: []
      - NoAuth: []
      - BasicAuth: []
  /v1/signatureProvider/contentSigning/embedSignatureTimestamp:
    post:
      tags:
      - Content Signing Formatting
      summary: Embed the signature timestamp
      description: "Embeds the timestamp token the platform obtained over the imprint\
        \ from computeSignatureTimestampImprint, raising the signature to TIMESTAMPED\
        \ level."
      operationId: embedSignatureTimestamp
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmbedTimestampRequest"
        required: true
      responses:
        "200":
          description: Timestamp embedded; the signed document is at TIMESTAMPED level
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SignedDocumentResponse"
        "400":
          description: Request body cannot be read (errorCode BAD_REQUEST)
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetailExtended"
        "422":
          description: |-
            - `SIGNATURE_NOT_FOUND` — the document carries no signature to attach the timestamp to.
            - `DOCUMENT_MALFORMED` — the document or token cannot be parsed.
            - `DOCUMENT_SIGNING_FORBIDDEN` — the document's permissions forbid adding the timestamp.
            - `PARAMETER_UNSUPPORTED` — the requested family or detachedContent is unsupported by the connector.
            - `VALIDATION_FAILED` — the body is readable but breaks a field rule, such as an absent or malformed family.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetailExtended"
        "401":
          description: Unauthorized
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetailExtended"
        "404":
          description: Not Found. Endpoint not found or not implemented
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetailExtended"
        "500":
          description: Internal Server Error
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetailExtended"
      security:
      - ConnectorAPIKeyAuth: []
      - CertificateTLSAuth: []
      - NoAuth: []
      - BasicAuth: []
  /v1/signatureProvider/contentSigning/embedArchiveTimestamp:
    post:
      tags:
      - Content Signing Formatting
      summary: Embed the archive timestamp
      description: "Embeds the timestamp token the platform obtained over the imprint\
        \ from computeArchiveTimestampImprint, raising the signature to ARCHIVAL level."
      operationId: embedArchiveTimestamp
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmbedTimestampRequest"
        required: true
      responses:
        "200":
          description: Timestamp embedded; the signed document is at ARCHIVAL level
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SignedDocumentResponse"
        "400":
          description: Request body cannot be read (errorCode BAD_REQUEST)
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetailExtended"
        "422":
          description: |-
            - `SIGNATURE_NOT_FOUND` — the document carries no signature to attach the timestamp to.
            - `DOCUMENT_MALFORMED` — the document or token cannot be parsed.
            - `PARAMETER_UNSUPPORTED` — the requested family or detachedContent is unsupported by the connector, or the connector does not declare ARCHIVAL for the family.
            - `VALIDATION_FAILED` — the body is readable but breaks a field rule, such as an absent or malformed family.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetailExtended"
        "401":
          description: Unauthorized
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetailExtended"
        "404":
          description: Not Found. Endpoint not found or not implemented
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetailExtended"
        "500":
          description: Internal Server Error
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetailExtended"
      security:
      - ConnectorAPIKeyAuth: []
      - CertificateTLSAuth: []
      - NoAuth: []
      - BasicAuth: []
  /v1/signatureProvider/contentSigning/computeSignatureTimestampImprint:
    post:
      tags:
      - Content Signing Formatting
      summary: Compute the signature timestamp imprint
      description: "Returns the message imprint over which the platform is to obtain\
        \ a signature timestamp, together with the digest algorithm that produced\
        \ it. The platform issues the token itself and brings it back to embedSignatureTimestamp."
      operationId: computeSignatureTimestampImprint
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SignedDocumentRequest"
        required: true
      responses:
        "200":
          description: Imprint computed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TimestampImprintResponse"
        "400":
          description: Request body cannot be read (errorCode BAD_REQUEST)
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetailExtended"
        "422":
          description: |-
            - `SIGNATURE_NOT_FOUND` — the document carries no signature to timestamp.
            - `DOCUMENT_MALFORMED` — the document cannot be parsed as the declared format.
            - `DOCUMENT_SIGNING_FORBIDDEN` — the document's permissions forbid adding the timestamp.
            - `PARAMETER_UNSUPPORTED` — the requested family or detachedContent is unsupported by the connector.
            - `VALIDATION_FAILED` — the body is readable but breaks a field rule, such as an absent or malformed family.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetailExtended"
        "401":
          description: Unauthorized
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetailExtended"
        "404":
          description: Not Found. Endpoint not found or not implemented
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetailExtended"
        "500":
          description: Internal Server Error
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetailExtended"
      security:
      - ConnectorAPIKeyAuth: []
      - CertificateTLSAuth: []
      - NoAuth: []
      - BasicAuth: []
  /v1/signatureProvider/contentSigning/computeDtbs:
    post:
      tags:
      - Content Signing Formatting
      summary: Compute data-to-be-signed bytes
      description: |-
        Builds the signature structure for the requested family and returns the bytes to be signed. It also returns the formattingContext needed to complete the signature once the signature value comes back.

        **Signing time.** The connector MUST put the supplied signingTime into the signature, not its own clock.

        **Signature algorithm.** The platform also supplies signatureAlgorithm, from the signer it resolved for this request. Only the platform sees both that key and the padding scheme its provider will apply. The connector MUST build the bytes for exactly that algorithm, and MUST NOT substitute one of its own.

        **Document digest.** The connector MUST embed the digest the request commits to. An inline transfer carries the document, and the connector digests it. A digestOnly transfer carries that digest already. The platform pins both to the digest signatureAlgorithm commits to, and checks that before it calls, so an algorithm whose paired digest is not a DigestAlgorithm value is never sent here. Either way the connector MUST echo that digest in documentDigest and its algorithm in documentDigestAlgorithm.

        **Request attributes.** `requestAttributes` carries the values the signing request sets, each allowed by the Signing Profile. The connector MUST merge them over the profile values in `formattingAttributes`, the request winning, and MUST refuse a request attribute that is undeclared or invalid, or a merged result that is incomplete or contradictory (errorCode `ATTRIBUTES_REJECTED`).
      operationId: computeDtbs
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ComputeDtbsRequest"
        required: true
      responses:
        "200":
          description: Data-to-be-signed bytes computed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ComputeDtbsResponse"
        "400":
          description: "Request body cannot be read (errorCode BAD_REQUEST), including\
            \ a transferMode that is absent or neither inline nor digestOnly. An entitlement\
            \ refusal is the 422 below instead."
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetailExtended"
        "422":
          description: |-
            - `ATTRIBUTES_REJECTED` — a request attribute is undeclared or invalid, or the request attributes merged over the profile values are incomplete or contradictory; the detail names the attributes.
            - `DOCUMENT_MALFORMED` — the document cannot be parsed as the declared format.
            - `DOCUMENT_SIGNING_FORBIDDEN` — the document forbids the requested signature, such as a certification of a document already signed.
            - `PARAMETER_UNSUPPORTED` — the requested family, the signatureAlgorithm, the document's transfer mode or the requested visible signature is unsupported by the connector.
            - `SIGNATURE_PLACEMENT_REJECTED` — the document cannot hold the visible signature at the requested place.
            - `VALIDATION_FAILED` — the body is readable but breaks a field rule, such as an absent or malformed family, an absent document, or a digest transfer missing its algorithm.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetailExtended"
        "401":
          description: Unauthorized
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetailExtended"
        "404":
          description: Not Found. Endpoint not found or not implemented
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetailExtended"
        "500":
          description: Internal Server Error
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetailExtended"
      security:
      - ConnectorAPIKeyAuth: []
      - CertificateTLSAuth: []
      - NoAuth: []
      - BasicAuth: []
  /v1/signatureProvider/contentSigning/computeArchiveTimestampImprint:
    post:
      tags:
      - Content Signing Formatting
      summary: Compute the archive timestamp imprint
      description: "Returns the message imprint over which the platform is to obtain\
        \ an archive timestamp. The archive timestamp covers the signature together\
        \ with its embedded validation material, which is why this step follows extendToLevel\
        \ rather than preceding it."
      operationId: computeArchiveTimestampImprint
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SignedDocumentRequest"
        required: true
      responses:
        "200":
          description: Imprint computed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TimestampImprintResponse"
        "400":
          description: Request body cannot be read (errorCode BAD_REQUEST)
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetailExtended"
        "422":
          description: |-
            - `SIGNATURE_NOT_FOUND` — the document carries no signature to timestamp.
            - `DOCUMENT_MALFORMED` — the document cannot be parsed as the declared format.
            - `PARAMETER_UNSUPPORTED` — the requested family or detachedContent is unsupported by the connector, or the connector does not declare ARCHIVAL for the family.
            - `VALIDATION_FAILED` — the body is readable but breaks a field rule, such as an absent or malformed family.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetailExtended"
        "401":
          description: Unauthorized
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetailExtended"
        "404":
          description: Not Found. Endpoint not found or not implemented
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetailExtended"
        "500":
          description: Internal Server Error
          content:
