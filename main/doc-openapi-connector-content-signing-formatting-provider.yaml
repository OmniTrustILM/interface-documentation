    EmbedSignatureValueRequest:
      type: object
      description: Request to embed a signature value into the structure computeDtbs
        prepared
      properties:
        family:
          type: string
          description: Signature family this request targets; a connector rejects
            a family its declaration does not list with 422 (errorCode `PARAMETER_UNSUPPORTED`)
          example: pades
          pattern: "^[a-z][a-z0-9-]*$"
        formattingAttributes:
          type: array
          description: "Attribute values the operator set on the Signing Profile,\
            \ each checked against its definition before the platform sends it. The\
            \ list carries the profile's whole set: validateProfile judges all of\
            \ it, and an operation with an attribute listing reads only the names\
            \ its own listing declares. May be an empty list, but must be present."
          items:
            $ref: "#/components/schemas/RequestAttribute"
        signatureValue:
          type: string
          format: byte
          description: "Raw signature over the data-to-be-signed bytes, base64-encoded\
            \ in JSON"
        signatureAlgorithm:
          $ref: "#/components/schemas/SignatureAlgorithm"
          description: "Signature algorithm the signature value was produced with,\
            \ the same value computeDtbs was given. Set by the platform from the resolved\
            \ signer; a connector MUST NOT select an algorithm itself, and MUST refuse\
            \ a value that disagrees with the algorithm its formattingContext committed\
            \ to with 422 and errorCode CONTEXT_MISMATCH."
        formattingContext:
          type: string
          format: byte
          description: "The formattingContext returned by computeDtbs, replayed verbatim.\
            \ Opaque to the platform, which never inspects, rewrites or stores it."
      required:
      - family
      - formattingAttributes
      - formattingContext
      - signatureAlgorithm
      - signatureValue
    SignatureAlgorithm:
      type: string
      description: "Signature algorithm, named by its code. It says nothing about\
        \ a digest an operation takes as a parameter of its own. Only the RSA, RSA-PSS\
        \ and ECDSA codes spell their digest out: such an algorithm hashes its input\
        \ with that digest and signs the result, so naming the algorithm names that\
        \ digest. RSA-PSS codes use MGF1 with the same hash as the code, a salt as\
        \ long as that hash's output, and trailer field 1. The other algorithms take\
        \ their input whole and hash it inside as their standard defines. For them\
        \ the platform records the digest it pairs the algorithm with and applies\
        \ to the document itself, one layer above the signature algorithm (in CMS,\
        \ the message-digest algorithm, as RFC 8419, RFC 9882 and RFC 9814 specify).\
        \ Ed25519 commits to SHA-512, FALCON-1024 commits to SHA-512, ML-DSA-44 commits\
        \ to SHA-512, ML-DSA-65 commits to SHA-512, ML-DSA-87 commits to SHA-512,\
        \ SLH-DSA-SHA2-128S commits to SHA-256, SLH-DSA-SHA2-128F commits to SHA-256,\
        \ SLH-DSA-SHA2-192S commits to SHA-512, SLH-DSA-SHA2-192F commits to SHA-512,\
        \ SLH-DSA-SHA2-256S commits to SHA-512, SLH-DSA-SHA2-256F commits to SHA-512,\
        \ and Ed448 commits to SHAKE256, which is not a DigestAlgorithm value."
      enum:
      - SHA256withRSA
      - SHA384withRSA
      - SHA512withRSA
      - SHA256withRSAandMGF1
      - SHA384withRSAandMGF1
      - SHA512withRSAandMGF1
      - SHA256withECDSA
      - SHA384withECDSA
      - SHA512withECDSA
      - Ed25519
      - Ed448
      - FALCON-1024
      - ML-DSA-44
      - ML-DSA-65
      - ML-DSA-87
      - SLH-DSA-SHA2-128S
      - SLH-DSA-SHA2-128F
      - SLH-DSA-SHA2-192S
      - SLH-DSA-SHA2-192F
      - SLH-DSA-SHA2-256S
      - SLH-DSA-SHA2-256F
