            \ its own listing declares. May be an empty list, but must be present."
          items:
            $ref: "#/components/schemas/RequestAttribute"
        document:
          $ref: "#/components/schemas/DocumentTransfer"
          description: "The document to sign, inline or as a digest"
        signerCertificateChain:
          type: array
          description: "Certificate chain whose first element is the signer certificate.\
            \ Each certificate is a DER-encoded X.509 certificate, base64-encoded\
