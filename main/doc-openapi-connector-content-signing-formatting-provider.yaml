    ComputeDtbsRequest:
      type: object
      description: Request to compute the data-to-be-signed bytes
      properties:
        family:
          type: string
          description: Signature family this request targets; a connector rejects
            a family its declaration does not list with 422 (errorCode `PARAMETER_UNSUPPORTED`)
          example: pades
          pattern: "^[a-z][a-z0-9-]*$"
        formattingAttributes:
          type: array
          description: "Attribute values the operator set on the Signing Profile,\
