  /v1/signatureProvider/contentSigning/{operation}/attributes:
    get:
      tags:
      - Content Signing Formatting
      summary: List the attributes configuring an operation
      description: "Returns the attribute definitions configuring how this connector\
        \ performs the named operation, split into profile attributes and request\
        \ attributes. The operator alone sets a profile attribute on the Signing Profile;\
        \ a signing request may override a request attribute's profile value where\
        \ the profile allows it. Only computeDtbs lists request attributes; every\
        \ other operation returns an empty `requestAttributes`. A request attribute's\
        \ `properties.group` names its permission group: a Signing Profile allows\
        \ a group as a whole, or an ungrouped request attribute on its own. Every\
        \ request attribute must be a data attribute whose name appears only in `requestAttributes`\
        \ across the operations a Signing Profile reaches, and no group may share\
        \ a request attribute's name; the platform refuses a listing that breaks one\
        \ of these rules. The platform collects these definitions when a Signing Profile\
        \ is configured and replays the operator's values in `formattingAttributes`\
        \ on every call to that operation."
      operationId: listContentSigningFormattingAttributes
      parameters:
      - name: operation
        in: path
        description: "Operation, identified by its wire code (e.g. \"computeDtbs\"\
          )"
        required: true
        schema:
          $ref: "#/components/schemas/ContentSigningFormattingOperation"
      responses:
        "200":
          description: Attribute schema retrieved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContentSigningFormattingAttributes"
        "400":
          description: The path segment names no content signing formatting operation
            (errorCode BAD_REQUEST)
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetailExtended"
        "401":
          description: Unauthorized
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetailExtended"
        "404":
          description: Not Found. Endpoint not found or not implemented
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetailExtended"
        "500":
          description: Internal Server Error
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetailExtended"
      security:
      - ConnectorAPIKeyAuth: []
      - CertificateTLSAuth: []
      - NoAuth: []
      - BasicAuth: []
  /v1/signatureProvider/contentSigning/declaration:
    get:
      tags:
      - Content Signing Formatting
      summary: Get the content-signing declaration
      description: "Returns the families this connector serves. Each family states\
        \ the levels it reaches, the transfer modes it signs from and the signature\
        \ algorithms it supports. The platform reads the declaration when it connects\
        \ or reconnects the connector, and refuses the connector when a family breaks\
        \ a rule its fields state. A changed declaration takes effect at the next\
        \ reconnect."
      operationId: getContentSigningDeclaration
      responses:
        "200":
          description: Declaration retrieved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContentSigningDeclaration"
        "401":
          description: Unauthorized
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetailExtended"
        "404":
          description: Not Found. Endpoint not found or not implemented
