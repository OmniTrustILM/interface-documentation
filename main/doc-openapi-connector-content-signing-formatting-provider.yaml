      properties:
        errors:
          type: array
          description: "Problems with the profile's values, each naming one attribute;\
            \ empty when the profile is valid"
          items:
            $ref: "#/components/schemas/ProfileAttributeError"
        transferModes:
          type: array
          description: "Transfer modes a signing request under this profile may send\
            \ its document in, each among the transfer modes the family declares;\
            \ at least one when `errors` is empty"
          items:
            $ref: "#/components/schemas/DocumentTransferMode"
          uniqueItems: true
      required:
      - errors
      - transferModes
    CertificateChain:
      type: object
      description: Certificate chain with its trust-anchor designation. Both lists
        must be present; either may be empty.
      properties:
        certificates:
          type: array
          description: "The chain to build validation material for: DER-encoded X.509\
            \ certificates covering every signature and timestamp in the document,\
            \ base64-encoded in JSON. May be an empty list, but must be present."
          items:
            type: string
            format: byte
        trustAnchors:
          type: array
          description: "DER-encoded X.509 certificates the platform resolved as the\
            \ termini of the chains above, base64-encoded in JSON. A connector treats\
            \ a certificate as an anchor only if it appears here, and an empty list\
            \ therefore means no anchor is designated and every certificate is treated\
            \ as untrusted. The designation comes from the chain the platform already\
            \ resolved, never from a trust configuration."
          items:
            type: string
            format: byte
      required:
      - certificates
      - trustAnchors
    DigestAlgorithm:
