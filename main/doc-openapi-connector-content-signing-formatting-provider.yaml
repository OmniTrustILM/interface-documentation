          items:
            $ref: "#/components/schemas/RequestAttribute"
      required:
      - document
      - family
      - formattingAttributes
      - requestAttributes
      - signatureAlgorithm
      - signerCertificateChain
      - signingTime
    ComputeDtbsResponse:
      type: object
      description: "Data-to-be-signed bytes, the documentDigest they commit to, and\
        \ the formattingContext that pairs with them"
      properties:
        dtbs:
          type: string
          format: byte
          description: "The data-to-be-signed bytes, base64-encoded in JSON. They\
            \ must embed `documentDigest`."
        documentDigest:
          type: string
          format: byte
          description: "Digest of the document the connector embedded in dtbs, base64-encoded\
            \ in JSON."
        documentDigestAlgorithm:
          $ref: "#/components/schemas/DigestAlgorithm"
          description: Algorithm that produced documentDigest.
        formattingContext:
          type: string
          format: byte
          description: "Whatever the connector needs to complete this signature once\
            \ the signature value comes back, base64-encoded in JSON. The platform\
            \ replays it verbatim to embedSignatureValue and never stores it."
      required:
      - documentDigest
      - documentDigestAlgorithm
      - dtbs
      - formattingContext
    ConnectorInfo:
      type: object
      properties:
        id:
          type: string
          description: Unique identifier of the connector
        name:
          type: string
          description: Name of the connector
        version:
          type: string
          description: Version of the connector
        description:
          type: string
          description: Description of the connector
        metadata:
          type: object
          additionalProperties: {}
          description: Metadata of the connector
      required:
      - id
      - name
      - version
    ConnectorInterfaceInfo:
      type: object
      properties:
        code:
          $ref: "#/components/schemas/ConnectorInterface"
          description: Code of the implemented connector interface
        version:
          type: string
          description: Version of the implemented connector interface
        features:
          type: array
          description: Features supported by the connector interface
          items:
            $ref: "#/components/schemas/FeatureFlag"
      required:
      - code
      - version
    FeatureFlag:
      type: string
      enum:
      - stateless
      - openMetrics
      - asynchronous
      - keyImport
      - keyExport
      - keyList
      - prehashedSigning
      - signerBoundAtCreation
      - secretVersioning
      - secretRotation
      - timestamping
      - certificateRegistration
      - certificateStatusPolling
      - certificateRequestStructured
      - certificateIdentityOverride
      - discoveryStopResume
      - discoveryIncremental
    InfoResponse:
      type: object
      properties:
        connector:
          $ref: "#/components/schemas/ConnectorInfo"
          description: Connector Information
        interfaces:
          type: array
          description: Interfaces supported and implemented by the connector
          items:
            $ref: "#/components/schemas/ConnectorInterfaceInfo"
      required:
      - connector
      - interfaces
    HealthInfo:
      type: object
      properties:
        status:
          $ref: "#/components/schemas/HealthStatus"
          description: Current connector operational status
        components:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/HealthInfoComponent"
          description: Health status of connector components
      required:
      - status
    HealthInfoComponent:
      type: object
      properties:
        status:
          $ref: "#/components/schemas/HealthStatus"
          description: Current status of component
        details:
          type: object
          additionalProperties: {}
          description: Additional details about the component status
      required:
      - status
    HealthStatus:
      type: string
      enum:
      - UP
      - DEGRADED
      - DOWN
      - OUT_OF_SERVICE
      - UNKNOWN
    AttributeDefinitionsDto:
      type: object
      properties:
        connectorVersion:
          type: string
          description: "Connector build version, echoed so Core can detect staleness.\
            \ A version string, not a content hash."
          minLength: 1
        definitions:
          type: array
          description: Attribute definitions keyed by connector-global UUID. Polymorphic
            across attribute schema v2/v3.
          items:
            $ref: "#/components/schemas/BaseAttributeDto"
      required:
      - connectorVersion
      - definitions
    ContentSigningFormattingOperation:
      type: string
      enum:
      - computeDtbs
      - embedSignatureValue
      - computeSignatureTimestampImprint
      - embedSignatureTimestamp
      - computeArchiveTimestampImprint
      - embedArchiveTimestamp
      - extendToLevel
    ContentSigningFormattingAttributes:
      type: object
      description: "Attribute definitions of content-signing formatting, split by\
        \ whether a signing request may set them"
      properties:
        profileAttributes:
          type: array
          description: Definitions of the attributes the operator alone sets on the
            Signing Profile
          items:
            $ref: "#/components/schemas/BaseAttributeDto"
        requestAttributes:
          type: array
          description: Definitions of the data attributes a signing request may override
            where the Signing Profile allows it; `properties.group` names each attribute's
            permission group
          items:
            $ref: "#/components/schemas/BaseAttributeDto"
      required:
      - profileAttributes
      - requestAttributes
    ContentSigningDeclaration:
      type: object
      description: "Declaration of families served by a content-signing formatting\
        \ connector; an object, so it can gain connector-wide facts without a break"
      properties:
        families:
          type: array
          description: "Families the connector serves, each with a unique code"
          items:
            $ref: "#/components/schemas/SignatureFamilyDeclaration"
          minItems: 1
      required:
      - families
    SignatureFamilyDeclaration:
      type: object
      description: Signature family a formatting connector serves
      properties:
        code:
          type: string
          description: Code of the family
          example: pades
          pattern: "^[a-z][a-z0-9-]*$"
        label:
          type: string
          description: Name of the family shown to an operator
          example: PAdES
          minLength: 1
        description:
          type: string
          description: Standard and document format the family follows
          example: "PDF Advanced Electronic Signatures, ETSI EN 319 142"
        levels:
          type: array
          description: "Levels the family reaches, from SIGNED upwards without a gap;\
            \ the last one is the family's ceiling"
          items:
            $ref: "#/components/schemas/SignatureLevelDeclaration"
          minItems: 1
        transferModes:
          type: array
          description: Transfer modes the family signs a document from
          items:
            $ref: "#/components/schemas/DocumentTransferMode"
          minItems: 1
          uniqueItems: true
        signatureAlgorithms:
          type: array
          description: "Signature algorithms the family supports, at least one; absent\
            \ when the family accepts every algorithm the platform can sign with"
          items:
            $ref: "#/components/schemas/SignatureAlgorithm"
          maxItems: 2147483647
          minItems: 1
          uniqueItems: true
      required:
      - code
      - label
      - levels
      - transferModes
    SignatureLevelDeclaration:
      type: object
      description: "Level a family reaches, with the name the family gives it"
      properties:
        level:
          $ref: "#/components/schemas/SignatureLevel"
          description: Level reached
        name:
          type: string
          description: Name the family gives the level
          example: PAdES-B-T
          minLength: 1
      required:
      - level
      - name
  securitySchemes:
    ConnectorAPIKeyAuth:
      type: apiKey
      description: API Key in header configured for connector
      name: X-API-KEY
      in: header
    BasicAuth:
      type: http
      scheme: Basic
    CertificateTLSAuth:
      type: mutualTLS
      description: Client certificate authentication
    NoAuth:
      type: http
      description: No authentication
      scheme: none
