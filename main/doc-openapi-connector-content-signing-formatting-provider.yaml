      - certificateChain
      - executionMode
      - family
      - formattingAttributes
      - signedDocument
      - targetLevel
    InlineDocumentTransfer:
      type: object
      description: Document transport carrying the document itself
      properties:
        document:
          type: string
          format: byte
          description: The document itself. Base64-encoded in JSON.
        transferMode:
          $ref: "#/components/schemas/DocumentTransferMode"
          description: "Transport this document uses, and the discriminator selecting\
            \ the fields that accompany it"
      required:
      - document
      - transferMode
    OperationExecutionMode:
      type: string
      description: Whether the connector must complete the operation inline or accept
        it for asynchronous processing
      enum:
      - synchronous
      - asynchronous
    SignatureLevel:
      type: string
      description: "Level a signature has reached, ordered from SIGNED up to ARCHIVAL\
        \ with each level containing the one before it"
      enum:
      - signed
      - timestamped
      - long_term
      - archival
    ValidationMaterial:
      type: object
      description: Validation material obtained outside the connector. Every list
        must be present; any of them may be empty.
      properties:
        certificates:
          type: array
          description: "Certificates already obtained elsewhere, embedded as supplied:\
            \ DER-encoded X.509, base64-encoded in JSON. May be an empty list, but\
            \ must be present."
          items:
            type: string
            format: byte
        crls:
          type: array
          description: "DER-encoded certificate revocation lists, base64-encoded in\
            \ JSON. May be an empty list, but must be present."
          items:
            type: string
            format: byte
        ocspResponses:
          type: array
          description: "DER-encoded OCSP responses, base64-encoded in JSON. May be\
            \ an empty list, but must be present."
          items:
            type: string
            format: byte
      required:
      - certificates
      - crls
      - ocspResponses
    ExtendToLevelResponse:
      type: object
      description: The extended document and the manifest of artifacts fetched to
        produce it. Populated on a synchronous 200; on an asynchronous 202 the document
        and manifest are absent and extendOperationMeta carries the tracking handle
        instead.
      properties:
        extendedDocument:
          type: string
          format: byte
          description: "The signed document with its validation material embedded,\
            \ base64-encoded in JSON. Populated on a synchronous 200; null on an asynchronous\
            \ 202."
        fetchManifest:
          type: array
          description: "Every artifact the connector fetched to build the material\
            \ it embedded. May be an empty list when the supplied prefetched material\
            \ already covered the signature, but must be present on a synchronous\
            \ 200 — an absent manifest would read as \"the connector did not look\"\
            , which is a different claim from \"the connector found nothing to fetch\"\
            ."
          items:
            $ref: "#/components/schemas/FetchedArtifact"
        extendOperationMeta:
          type: array
          description: Connector-defined metadata tracking the operation. Present
