    ValidateProfileRequest:
      type: object
      description: Signing Profile values the connector judges as a whole before the
        profile is saved
      properties:
        family:
          type: string
          description: Signature family this request targets; a connector rejects
            a family its declaration does not list with 422 (errorCode `PARAMETER_UNSUPPORTED`)
          example: pades
          pattern: "^[a-z][a-z0-9-]*$"
        formattingAttributes:
          type: array
          description: "Attribute values the operator set on the Signing Profile,\
            \ each checked against its definition before the platform sends it. The\
            \ list carries the profile's whole set: validateProfile judges all of\
            \ it, and an operation with an attribute listing reads only the names\
            \ its own listing declares. May be an empty list, but must be present."
          items:
            $ref: "#/components/schemas/RequestAttribute"
        allowedRequestAttributes:
          type: array
          description: "Names of the groups and ungrouped request attributes a signing\
            \ request may set, as the Signing Profile allows them. A value the profile\
            \ leaves unset can come only from a request allowed to set it. May be\
            \ an empty set, but must be present."
          items:
            type: string
            minLength: 1
          uniqueItems: true
      required:
      - allowedRequestAttributes
      - family
      - formattingAttributes
    DocumentTransferMode:
      type: string
      enum:
      - inline
      - digestOnly
    ProfileAttributeError:
      type: object
      description: Problem the connector found with one attribute of a Signing Profile
      properties:
        attributeName:
          type: string
          description: "Name of the attribute, as the connector's listing declares\
            \ it"
          example: font
          minLength: 1
        reason:
          type: string
          description: "Reason the connector cannot use the value, for the operator\
            \ to read"
          example: The font file cannot be parsed
          minLength: 1
      required:
      - attributeName
      - reason
    ValidateProfileResponse:
      type: object
      description: "Connector's judgement of a Signing Profile: the problems it found\
