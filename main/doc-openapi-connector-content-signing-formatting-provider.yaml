        \ or only its digest for a signature family that can sign from one."
      discriminator:
        propertyName: transferMode
        mapping:
          inline: "#/components/schemas/InlineDocumentTransfer"
          digestOnly: "#/components/schemas/DigestOnlyDocumentTransfer"
      oneOf:
      - $ref: "#/components/schemas/InlineDocumentTransfer"
      - $ref: "#/components/schemas/DigestOnlyDocumentTransfer"
      required:
      - transferMode
    ExtendToLevelRequest:
      type: object
      description: "Request to fetch and embed validation material, raising a signature\
        \ to the target level"
      properties:
        family:
          type: string
          description: Signature family this request targets; a connector rejects
            a family its declaration does not list with 422 (errorCode `PARAMETER_UNSUPPORTED`)
          example: pades
          pattern: "^[a-z][a-z0-9-]*$"
        formattingAttributes:
          type: array
          description: "Attribute values the operator set on the Signing Profile,\
            \ each checked against its definition before the platform sends it. The\
            \ list carries the profile's whole set: validateProfile judges all of\
            \ it, and an operation with an attribute listing reads only the names\
            \ its own listing declares. May be an empty list, but must be present."
          items:
            $ref: "#/components/schemas/RequestAttribute"
        signedDocument:
          type: string
          format: byte
          description: "The signed document as it stands, base64-encoded in JSON.\
            \ A connector that cannot find the signature it is asked to act on answers\
            \ 422 with errorCode SIGNATURE_NOT_FOUND."
        detachedContent:
          $ref: "#/components/schemas/DocumentTransfer"
          description: "The originally signed content, for detached packaging where\
            \ the signature does not envelop what it signs and the operation cannot\
            \ proceed without it. Absent for enveloped packaging, where the signed\
            \ document already carries its content."
        targetLevel:
          $ref: "#/components/schemas/SignatureLevel"
          description: Level the signature is to reach. LONG_TERM is the only target
            this operation serves; the timestamped levels are reached through their
            own imprint and embed pair instead.
          enum:
          - long_term
        certificateChain:
          $ref: "#/components/schemas/CertificateChain"
          description: "The chain to build validation material for, with the designation\
            \ of where it stops"
        prefetchedMaterial:
          $ref: "#/components/schemas/ValidationMaterial"
          description: "Validation material already obtained elsewhere. When supplied,\
            \ the connector embeds it and fetches only what is still missing. Reserved\
            \ for a deployment that sources material outside the connector; no platform\
            \ caller fills it today."
        executionMode:
          $ref: "#/components/schemas/OperationExecutionMode"
          description: How the caller wants the operation executed. The platform always
            sends SYNCHRONOUS and treats a 202 as a contract violation; ASYNCHRONOUS
            opens once both sides advertise support for it.
