      - SHA-384
      - SHA-512
      - SHA3-256
      - SHA3-384
      - SHA3-512
    DigestOnlyDocumentTransfer:
      type: object
      description: Document transport carrying only the document's digest
      properties:
        documentDigest:
          type: string
          format: byte
          description: "Digest of the document, where the document itself never enters\
            \ the platform. Base64-encoded in JSON."
        digestAlgorithm:
          $ref: "#/components/schemas/DigestAlgorithm"
          description: "Algorithm that produced documentDigest. The enum spans every\
            \ algorithm the platform knows, including collision-broken ones."
        transferMode:
          $ref: "#/components/schemas/DocumentTransferMode"
