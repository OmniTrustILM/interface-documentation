          example: b11c9be1-b619-4ef5-be1b-a1cd9ef265b7
        name:
          type: string
          description: Name of the Attribute that is used for identification
          examples:
          - Attribute
        description:
          type: string
          description: "Optional description of the Attribute, should contain helper\
            \ text on what is expected"
        version:
          type: integer
          format: int32
          description: Version of the attribute
        type:
          $ref: "#/components/schemas/AttributeType"
          description: Type of the Attribute
        content:
          type: array
          description: Content of the Attribute
          items:
            $ref: "#/components/schemas/BaseAttributeContentDtoV2"
        contentType:
          $ref: "#/components/schemas/AttributeContentType"
          description: Type of the Content
        properties:
          $ref: "#/components/schemas/MetadataAttributeProperties"
          description: Properties of the Attributes
      required:
      - contentType
      - name
      - properties
      - type
      - uuid
      - version
    MetadataAttributeV3:
      type: object
      description: Info attribute contains content that is for metadata. Its content
        can not be edited and is not send in requests to store.
      properties:
        uuid:
          type: string
          description: UUID of the Attribute for unique identification
          example: b11c9be1-b619-4ef5-be1b-a1cd9ef265b7
        name:
          type: string
          description: Name of the Attribute that is used for identification
          examples:
          - Attribute
        description:
          type: string
          description: "Optional description of the Attribute, should contain helper\
            \ text on what is expected"
        version:
          type: integer
          format: int32
          description: Version of the attribute
        type:
          $ref: "#/components/schemas/AttributeType"
          description: Type of the Attribute
        content:
          type: array
          description: Content of the Attribute
          items:
            $ref: "#/components/schemas/BaseAttributeContentDtoV3"
        contentType:
          $ref: "#/components/schemas/AttributeContentType"
          description: Type of the Content
        properties:
          $ref: "#/components/schemas/MetadataAttributeProperties"
          description: Properties of the Attributes
        schemaVersion:
          $ref: "#/components/schemas/AttributeVersion"
          description: Schema version of the Attribute
      required:
      - contentType
      - name
      - properties
      - schemaVersion
      - type
      - uuid
      - version
    ObjectType:
      type: string
      enum:
      - x509Certificate
      - sshCertificate
      - key
      - secret
    RdnMappedField:
      allOf:
      - $ref: "#/components/schemas/MappedField"
      - type: object
        properties:
          rdn:
            type: string
            description: RDN code (e.g. "CN") or dotted-decimal OID; resolved via
              the OID registry
            minLength: 1
      description: Maps an attribute value to an X.509 RDN component
      required:
      - fieldType
      - rdn
    SanMappedField:
      allOf:
      - $ref: "#/components/schemas/MappedField"
      - type: object
        properties:
          generalNameType:
            $ref: "#/components/schemas/GeneralNameType"
            description: SAN type
          otherNameOid:
            type: string
            description: OID of the otherName type; required when generalNameType
              is OTHER_NAME
          otherNameValueEncoding:
            $ref: "#/components/schemas/ExtensionValueEncoding"
            description: ASN.1 encoding for the otherName value; required when generalNameType
              is OTHER_NAME because different OtherName OIDs carry differently-typed
              values (e.g. UPN → UTF8String)
      description: Maps an attribute value to a Subject Alternative Name entry
      required:
      - fieldType
      - generalNameType
    SourceParam:
      type: object
      description: Dependency filter that scopes a value source by another attribute's
        value
      properties:
        attributeUuid:
          type: string
          description: UUID of the attribute whose value is used as a filter parameter
        attributeName:
          type: string
          description: Name of the attribute; used as fallback when attributeUuid
            is not matched
    ValueSource:
      type: object
      description: Declares how Core resolves the content of an attribute; orthogonal
        to fieldMapping
      properties:
        kind:
          $ref: "#/components/schemas/ValueSourceType"
          description: How the attribute value is resolved
        params:
          type: array
          description: Optional dependency filters that scope the source by other
            attributes' values
          items:
            $ref: "#/components/schemas/SourceParam"
      required:
      - kind
    ValueSourceType:
      type: string
      enum:
      - none
      - connectorCallback
      - staticList
    DigestAlgorithm:
      type: string
      enum:
      - MD5
      - SHA-1
      - SHA-224
      - SHA-256
      - SHA-384
      - SHA-512
      - SHA3-256
      - SHA3-384
      - SHA3-512
    ExtensionDto:
      type: object
      description: "ASN.1 extension (OID, criticality, value)"
      properties:
        oid:
          type: string
          description: OID of the extension
          example: 1.3.6.1.5.5.7.1.1
          minLength: 1
        critical:
          type: boolean
          description: Whether the extension is critical
        value:
          type: string
          description: Base64-encoded DER value of the extension
      required:
      - critical
      - oid
      - value
      title: ExtensionDto
    FormatResponseInterface:
      type: object
      description: Response formatting request specific to the signing workflow type
      discriminator:
        propertyName: type
        mapping:
          timestamping: "#/components/schemas/TimestampingFormatResponseRequestDto"
      oneOf:
      - $ref: "#/components/schemas/TimestampingFormatResponseRequestDto"
      required:
      - type
    SignatureAlgorithm:
      type: string
      description: "Signature algorithm, named by its code. Each algorithm fixes the\
        \ digest carried inside the signature it produces, so naming the algorithm\
        \ names that digest. It says nothing about a digest an operation takes as\
        \ a parameter of its own. Where the code spells its digest out, that is the\
        \ digest. Where it does not, the platform records the digest it pairs the\
        \ algorithm with: Ed25519 commits to SHA-512, FALCON-1024 commits to SHA-512,\
        \ ML-DSA-65 commits to SHA-512, SLH-DSA-SHA2-128F commits to SHA-256, and\
        \ Ed448 commits to SHAKE256, which is not a DigestAlgorithm value."
      enum:
      - SHA256withRSA
      - SHA384withRSA
      - SHA512withRSA
      - SHA256withRSAandMGF1
      - SHA384withRSAandMGF1
      - SHA512withRSAandMGF1
      - SHA256withECDSA
      - SHA384withECDSA
      - SHA512withECDSA
      - Ed25519
      - Ed448
      - FALCON-1024
      - ML-DSA-65
      - SLH-DSA-SHA2-128F
    SigningWorkflowType:
      type: string
      enum:
      - content_signing
      - raw_signing
      - timestamping
    TimestampingFormatResponseRequestDto:
      type: object
      description: Response formatting request for Timestamping
      properties:
        type:
          $ref: "#/components/schemas/SigningWorkflowType"
          description: Signing workflow type
          examples:
          - timestamping
        dtbs:
          type: string
          format: byte
          description: "Data-to-be-signed bytes returned by formatDtbs (already contains\
            \ serialNumber, signingTime, etc.)"
        signature:
          type: string
          format: byte
          description: Raw signature bytes from the Cryptography Provider
        certificateChain:
          type: array
          description: Certificate chain where the first element is the signer certificate
          items:
            type: string
            format: byte
          minItems: 1
        formatAttributes:
          type: array
          description: "Formatting-specific parameters, same attributes as passed\
            \ to formatDtbs"
          items:
            $ref: "#/components/schemas/RequestAttribute"
        serialNumber:
          type: integer
          description: "Serial number generated by Core, recorded in the Signature\
            \ inventory"
        signingTime:
          type: string
          format: date-time
          description: Signing time captured by Core from the time quality system
          example: 2024-05-01T12:00:00Z
        accuracy:
          type: string
          description: "Accuracy of the signing time, captured by Core from the time\
            \ quality system (ISO 8601 duration, e.g. PT0.001S for 1 ms). Optional\
            \ per RFC 3161 — absent when no Time Quality Configuration applies (e.g.\
            \ a non-qualified local-clock timestamp)."
          example: PT0.001S
        signatureAlgorithm:
          $ref: "#/components/schemas/SignatureAlgorithm"
          description: Signature algorithm to be used for timestamping
        hashAlgorithm:
          $ref: "#/components/schemas/DigestAlgorithm"
          description: Hash algorithm used to produce the message imprint in the timestamp
            request
        policy:
          type: string
          description: TSA policy OID requested by the client
        nonce:
          type: integer
          description: Nonce from the timestamp request for replay protection
        includeSignerCertificate:
          type: boolean
          description: Whether the signer certificate should be included in the response
        qualifiedTimestamp:
          type: boolean
          description: Whether the timestamp is ETSI qualified electronic timestamp
        requestExtensions:
          type: array
          description: Extensions from the timestamp request
          items:
            $ref: "#/components/schemas/ExtensionDto"
        data:
          type: string
          format: byte
          description: The hashed message (message imprint) — needed to rebuild the
            TimeStampRequest
      required:
      - certificateChain
      - data
      - dtbs
      - formatAttributes
      - hashAlgorithm
      - includeSignerCertificate
      - qualifiedTimestamp
      - serialNumber
      - signature
      - signatureAlgorithm
      - signingTime
      - type
      title: TimestampingFormatResponseRequestDto
    FormattedResponseDto:
      type: object
      properties:
        response:
          type: string
          format: byte
          description: Final formatted output bytes (e.g. DER-encoded TimeStampResp
            for TSA)
      required:
      - response
    FormatDtbsInterface:
      type: object
      description: DTBS formatting request specific to the signing workflow type
      discriminator:
        propertyName: type
        mapping:
          timestamping: "#/components/schemas/TimestampingFormatDtbsRequestDto"
      oneOf:
      - $ref: "#/components/schemas/TimestampingFormatDtbsRequestDto"
      required:
      - type
    TimestampingFormatDtbsRequestDto:
      type: object
      description: DTBS formatting request for Timestamping
      properties:
        type:
          $ref: "#/components/schemas/SigningWorkflowType"
          description: Signing workflow type
          examples:
          - timestamping
        certificateChain:
          type: array
          description: Certificate chain where the first element is the signer certificate.
            Individual certificates are DER encoded X.509 certificates (represented
            as Base64 strings in the JSON transport).
          items:
            type: string
            format: byte
          minItems: 1
        data:
          type: string
          format: byte
          description: Data to be formatted into the protocol-specific data-to-be-signed
            bytes
        formatAttributes:
          type: array
          description: "Formatting-specific parameters (e.g. message imprint hash\
            \ and algorithm, nonce, policy OID for TSA)"
          items:
            $ref: "#/components/schemas/RequestAttribute"
        serialNumber:
          type: integer
          description: "Serial number generated by Core, recorded in the Signature\
            \ inventory"
        signingTime:
          type: string
          format: date-time
          description: Signing time captured by Core from the time quality system
          example: 2024-05-01T12:00:00Z
        accuracy:
          type: string
          description: "Accuracy of the signing time, captured by Core from the time\
            \ quality system (ISO 8601 duration, e.g. PT0.001S for 1 ms). Optional\
            \ per RFC 3161 — absent when no Time Quality Configuration applies (e.g.\
            \ a non-qualified local-clock timestamp)."
          example: PT0.001S
        signatureAlgorithm:
          $ref: "#/components/schemas/SignatureAlgorithm"
          description: Signature algorithm to be used for timestamping
        hashAlgorithm:
          $ref: "#/components/schemas/DigestAlgorithm"
          description: Hash algorithm used to produce the message imprint in the timestamp
            request
        policy:
          type: string
          description: TSA policy OID requested by the client
        nonce:
          type: integer
          description: Nonce from the timestamp request for replay protection
        includeSignerCertificate:
          type: boolean
          description: Whether the signer certificate should be included in the response
        qualifiedTimestamp:
          type: boolean
          description: Whether the timestamp is ETSI qualified electronic timestamp
        requestExtensions:
          type: array
          description: Extensions from the timestamp request
          items:
            $ref: "#/components/schemas/ExtensionDto"
      required:
      - certificateChain
      - data
      - formatAttributes
      - hashAlgorithm
      - includeSignerCertificate
      - qualifiedTimestamp
      - serialNumber
      - signatureAlgorithm
      - signingTime
      - type
      title: TimestampingFormatDtbsRequestDto
    FormatDtbsResponseDto:
      type: object
      properties:
        dtbs:
          type: string
          format: byte
          description: Data-to-be-signed bytes (e.g. DER-encoded TSTInfo for TSA)
      required:
      - dtbs
    ConnectorInfo:
      type: object
      properties:
        id:
          type: string
          description: Unique identifier of the connector
        name:
          type: string
          description: Name of the connector
        version:
          type: string
          description: Version of the connector
        description:
          type: string
          description: Description of the connector
        metadata:
          type: object
          additionalProperties: {}
          description: Metadata of the connector
      required:
      - id
      - name
      - version
    ConnectorInterfaceInfo:
      type: object
      properties:
        code:
          $ref: "#/components/schemas/ConnectorInterface"
          description: Code of the implemented connector interface
        version:
          type: string
          description: Version of the implemented connector interface
        features:
          type: array
          description: Features supported by the connector interface
          items:
            $ref: "#/components/schemas/FeatureFlag"
      required:
      - code
      - version
    FeatureFlag:
      type: string
      enum:
      - stateless
      - openMetrics
      - asynchronous
      - keyImport
      - keyExport
      - secretVersioning
      - secretRotation
      - contentSigning
      - levelTimestamped
      - levelLongTerm
      - levelArchival
      - timestamping
      - certificateRegistration
      - certificateStatusPolling
      - certificateRequestStructured
      - certificateIdentityOverride
      - discoveryStreaming
      - discoveryStopResume
    InfoResponse:
      type: object
      properties:
        connector:
          $ref: "#/components/schemas/ConnectorInfo"
          description: Connector Information
        interfaces:
          type: array
          description: Interfaces supported and implemented by the connector
          items:
            $ref: "#/components/schemas/ConnectorInterfaceInfo"
      required:
      - connector
      - interfaces
    HealthInfo:
      type: object
      properties:
        status:
          $ref: "#/components/schemas/HealthStatus"
          description: Current connector operational status
        components:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/HealthInfoComponent"
          description: Health status of connector components
      required:
      - status
    HealthInfoComponent:
      type: object
      properties:
        status:
          $ref: "#/components/schemas/HealthStatus"
          description: Current status of component
        details:
          type: object
          additionalProperties: {}
          description: Additional details about the component status
      required:
      - status
    HealthStatus:
      type: string
      enum:
      - UP
      - DEGRADED
      - DOWN
      - OUT_OF_SERVICE
      - UNKNOWN
    AttributeDefinitionsDto:
      type: object
      properties:
        connectorVersion:
          type: string
          description: "Connector build version, echoed so Core can detect staleness.\
            \ A version string, not a content hash."
          minLength: 1
        definitions:
          type: array
          description: Attribute definitions keyed by connector-global UUID. Polymorphic
            across attribute schema v2/v3.
          items:
            $ref: "#/components/schemas/BaseAttributeDto"
      required:
      - connectorVersion
      - definitions
  securitySchemes:
    ConnectorAPIKeyAuth:
      type: apiKey
      description: API Key in header configured for connector
      name: X-API-KEY
      in: header
    BasicAuth:
      type: http
