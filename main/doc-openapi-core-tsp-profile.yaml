    TspBasicCredentialUpdateRequestDto:
      type: object
      description: "A Basic (username/password) credential to update on a TSP Profile.\
        \ The password is write-only: leave it blank to keep the existing secret,\
        \ or provide a value to rotate it. Changing the username requires a new password."
      properties:
        username:
          type: string
          description: Basic username; unique within the TSP profile. Changing it
            requires a new password.
          example: svc-account
          minLength: 1
        password:
          type: string
          description: Basic password (write-only). Blank keeps the existing secret
            and a value rotates it; a value is also required when the username changes.
          writeOnly: true
        mappedUserUuid:
          type: string
          format: uuid
          description: UUID of the real ILM user this credential authenticates as.
          example: 6b55de1c-844f-11ec-a8a3-0242ac120002
      required:
      - mappedUserUuid
      - username
    TspBasicCredentialDto:
      type: object
      description: Read-only view of a Basic credential on a TSP Profile.
      properties:
        uuid:
          type: string
          format: uuid
          description: UUID of this credential
        username:
          type: string
          description: Basic username
          example: svc-account
        mappedUser:
          $ref: "#/components/schemas/NameAndUuidDto"
          description: The real ILM user this credential authenticates as
      required:
      - mappedUser
      - username
      - uuid
    TspBasicCredentialCreateRequestDto:
      type: object
      description: A Basic (username/password) credential to create on a TSP Profile.
      properties:
        username:
          type: string
          description: Basic username; unique within the TSP profile.
          example: svc-account
          minLength: 1
        password:
          type: string
          description: Basic password (write-only). Required on create.
          minLength: 1
          writeOnly: true
        mappedUserUuid:
          type: string
          format: uuid
          description: UUID of the real ILM user this credential authenticates as.
          example: 6b55de1c-844f-11ec-a8a3-0242ac120002
      required:
      - mappedUserUuid
      - password
      - username
