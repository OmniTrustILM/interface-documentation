    <ul class="list-unstyled components">

      <li class="active">

      <li class="active">

  <!-- Page Content Holder -->
  <div id="content">

    <div id="iFrameDivision">
      <iframe
              key="showapi"
              id="showapi"
              src="about:blank"
              width="100%"
              height="100%"
              frameborder="0"
      ></iframe>
    </div>
</div>

    // placeholder for the list of APIS

          {"name": "Connector", "url": "doc-openapi-core-connector.html"},
          {"name": "Credential", "url": "doc-openapi-core-credential.html"},
          {"name": "Cryptographic Key", "url": "doc-openapi-core-cryptographic-key.html"},
          {"name": "Cryptographic Operations", "url": "doc-openapi-core-cryptographic-operations.html"},
          {"name": "Discovery", "url": "doc-openapi-core-discovery.html"},
          {"name": "Entity", "url": "doc-openapi-core-entity.html"},
          {"name": "Group", "url": "doc-openapi-core-group.html"},

          {"name": "Location", "url": "doc-openapi-core-location.html"},

          {"name": "Proxy", "url": "doc-openapi-core-proxy.html"},
          {"name": "RA Profile", "url": "doc-openapi-core-ra-profile.html"},

          {"name": "Uncategorized", "url": "doc-openapi-core-other.html"},
          {"name": "Vault", "url": "doc-openapi-core-vault.html"},
          {"name": "Vault Profile", "url": "doc-openapi-core-vault-profile.html"},
          {"name": "Workflows", "url": "doc-openapi-core-workflows.html"},
        ];

        var connectorApis = [
          {"name": "Authority Provider Legacy", "url": "doc-openapi-connector-authority-provider-legacy.html"},
          {"name": "Authority Provider v2", "url": "doc-openapi-connector-authority-provider-v2.html"},

          {"name": "Credential Provider", "url": "doc-openapi-connector-credential-provider.html"},
          {"name": "Cryptography Provider", "url": "doc-openapi-connector-cryptography-provider.html"},
          {"name": "Cryptography Provider v2", "url": "doc-openapi-connector-cryptography-provider-v2.html"},
          {"name": "Discovery Provider", "url": "doc-openapi-connector-discovery-provider.html"},
          {"name": "Discovery Provider v2", "url": "doc-openapi-connector-discovery-provider-v2.html"},
          {"name": "Entity Provider", "url": "doc-openapi-connector-entity-provider.html"},
          {"name": "Notification Provider", "url": "doc-openapi-connector-notification-provider.html"},
          {"name": "Secret Provider", "url": "doc-openapi-connector-secret-provider.html"},
          {"name": "Signature Formatting Provider", "url": "doc-openapi-connector-signature-formatting-provider.html"},
        ];

        var messagingApis = [
          {"name": "Time Quality Messaging", "url": "doc-openapi-messaging-time-quality.html"},
        ];

        var protocolApis = [
          {"name": "ACME", "url": "doc-openapi-protocol-acme.html"},
          {"name": "CMP", "url": "doc-openapi-protocol-cmp.html"},
          {"name": "SCEP", "url": "doc-openapi-protocol-scep.html"},
          {"name": "TSP", "url": "doc-openapi-protocol-tsp.html"},
        ];

    // initially render first API
    var iframe = document.getElementById("showapi");
    iframe.src = connectorApis[1].url;
    window.addEventListener("resize", onResize)

    function onResize() {
      var frame = document.getElementById("showapi");
      frame.height = frame?.ownerDocument.documentElement.clientHeight + "px";
    }

    const ifElement =
            iframe?.ownerDocument.documentElement.clientHeight;
    iframe.height = ifElement + "px";
    function onClick() {
      var url = this.getAttribute("data-link");
      document.getElementById("showapi").src = url;
    }

    // dynamically building navigation items
    var $list = document.getElementById("coreApiSubmenu");
    coreApis.forEach(function (api) {
      var $listitem = document.createElement("li");
      $listitem.setAttribute("data-link", api.url);
      $listitem.setAttribute("class", "dropdown-item");
      //$listitem.innerText = api.name;
      $listitem.addEventListener("click", onClick);
      var $lista = document.createElement("a");
      $lista.setAttribute("href", "#");
      $lista.innerText = api.name;
      $listitem.appendChild($lista);
      $list.appendChild($listitem);
    });

    var $list = document.getElementById("connectorApiSubmenu");
    connectorApis.forEach(function (api) {
      var $listitem = document.createElement("li");
      $listitem.setAttribute("data-link", api.url);
      $listitem.setAttribute("class", "dropdown-item");
      //$listitem.innerText = api.name;

      $list.appendChild($listitem);
    });

    messagingApis.forEach(function (api) {

      $list.appendChild($listitem);
    });

    var $list = document.getElementById("protocolApiSubmenu");
    protocolApis.forEach(function (api) {
      var $listitem = document.createElement("li");
      $listitem.setAttribute("data-link", api.url);
      $listitem.setAttribute("class", "dropdown-item");
      //$listitem.innerText = api.name;
      $listitem.addEventListener("click", onClick);
      var $lista = document.createElement("a");
      $lista.setAttribute("href", "#");
      $lista.innerText = api.name;
      $listitem.appendChild($lista);
      $list.appendChild($listitem);
    });
  </script>
