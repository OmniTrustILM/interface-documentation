    SignDocumentItem:
      type: object
      description: "Document to sign, identified by the caller"
      properties:
        identifier:
          type: string
          description: Identifier used to correlate the item with its result; unique
            within the request
          examples:
          - contract-2026-17
          minLength: 1
        document:
          type: string
          format: byte
          description: "Document to sign, base64-encoded in JSON. Required when `transferMode`\
            \ is `inline`; absent otherwise."
        documentDigest:
          type: string
          format: byte
          description: "Digest of the document to sign, base64-encoded in JSON. Required\
            \ when `transferMode` is `digestOnly`, and its decoded length must match\
            \ the output size of `digestAlgorithm` in bytes; absent otherwise."
      required:
      - identifier
    SignDocumentRequest:
      type: object
      description: "Documents to sign at the Signing Profile's signature level, inline\
        \ or as digests"
      properties:
        transferMode:
          $ref: "#/components/schemas/DocumentTransferMode"
          description: How every item of the request carries its document
        digestAlgorithm:
          $ref: "#/components/schemas/DigestAlgorithm"
          description: Algorithm that produced every item's `documentDigest`. Required
            when `transferMode` is `digestOnly` and must be the digest the Signing
            Profile's signature algorithm commits to; absent otherwise.
        items:
          type: array
          description: "Documents to sign, each with an identifier unique within the\
            \ request. The platform's `maxItemsPerRequest` signing setting bounds\
            \ how many a request may carry, with a default of 100."
          items:
            $ref: "#/components/schemas/SignDocumentItem"
          minItems: 1
        requestAttributes:
          type: array
          description: "Values the request sets for request attributes, each allowed\
            \ by the Signing Profile; the formatting connector merges them over the\
            \ profile's values. Each value takes the version of its attribute definition.\
            \ Absent means none."
          items:
            $ref: "#/components/schemas/RequestAttribute"
      required:
      - items
      - transferMode
    StringAttributeContentV2:
      type: object
