    AuthenticationServiceExceptionDto:
      type: object
      properties:
        statusCode:
          type: integer
          format: int32
          description: Status code of the HTTP Request
        code:
          type: string
          description: Code of the result
        message:
          type: string
          description: Exception message
      required:
      - code
      - message
      - statusCode
    SignDocumentResponse:
      type: object
      description: Signing outputs of every request item
      properties:
        results:
          type: array
          description: "One result per request item, in request order"
          items:
            $ref: "#/components/schemas/SignDocumentResult"
          minItems: 1
      required:
      - results
    SignDocumentResult:
      type: object
      description: Signing output of one request item
      properties:
        identifier:
          type: string
          description: Identifier of the corresponding request item
          examples:
          - contract-2026-17
        signingRecordUuid:
          type: string
          format: uuid
          description: "UUID of this item's signing record; absent when the Signing\
            \ Profile's record policy disables recording, or when a `best_effort`\
            \ record could not be staged. A `best_effort` record may still be lost\
            \ after it is staged."
        output:
          type: string
          format: byte
          description: "Signing output, base64-encoded in JSON: the signed document,\
            \ the detached signature or the container, as the Signing Profile's signature\
            \ format produces"
        mediaType:
          type: string
          description: "Media type of `output`, as the formatting connector names\
            \ it"
          examples:
          - application/pdf
      required:
      - identifier
      - mediaType
      - output
  securitySchemes:
    SessionAuth:
      type: apiKey
      description: Session-based authentication with session ID stored in 'session-id'
        cookie
      name: session-id
      in: cookie
    CertificateAuth:
      type: apiKey
      description: Base64 encoded X.509 certificate passed in header
      name: ssl-client-cert
      in: header
    BearerJWTAuth:
      type: http
      scheme: Bearer
      bearerFormat: JWT
