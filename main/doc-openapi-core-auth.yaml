    UserProfilePermissionsDto:
      type: object
      properties:
        allowedListings:
          type: array
          description: Allowed resource listings
          items:
            $ref: "#/components/schemas/Resource"
        allowedActions:
          type: array
          description: |
            Actions the user is permitted to perform on a resource as a whole, per resource. Use this, not allowedListings, to decide whether to offer a control for anything other than a listing.

            Reports resource-level grants only. Object-scoped grants are excluded, including the implicit access an owner or a group member has, because an action held on one object says nothing about the next: a control scoped to a single object must still be decided by the server. Resources on which the caller holds no action are omitted rather than reported with an empty list, and actions the authorization service will not grant at all are never reported.

            This is not derivable from allowedListings and does not supersede it. That field applies a broader rule to the list action alone, unioning object-scoped grants and adding the listings every user gets by default, so neither field can be computed from the other.
          items:
            $ref: "#/components/schemas/ResourceActionsDto"
      required:
      - allowedActions
      - allowedListings
