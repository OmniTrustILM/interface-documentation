      - retryable
      - status
      - timestamp
      - type
    DiscoveryRunRequestDto:
      type: object
      properties:
        runId:
          type: string
          format: uuid
          description: Discovery run identifier assigned by Core when the run was
            created
        meta:
          type: array
          description: "Connector-defined metadata returned in the original discovery\
            \ initiate/stop/resume response, replayed here so the stateless connector\
            \ can resolve its run state; absent on the initiate call itself, which\
            \ is the call that mints it. Serialized size is capped at 64 KB."
          items:
            $ref: "#/components/schemas/MetadataAttribute"
        attributes:
          type: array
          description: "Run-level attributes supplied when the discovery run was initiated;\
            \ optional, since a connector may define no run-level attributes at all."
          items:
            $ref: "#/components/schemas/RequestAttribute"
        resourceAttributes:
          type: object
          additionalProperties:
            type: array
            items:
              $ref: "#/components/schemas/RequestAttribute"
          description: "Per-resource attributes, keyed by resource code (e.g. \"certificates\"\
            , \"keys\"); optional, since a connector may define none."
          propertyNames:
            $ref: "#/components/schemas/Resource"
      required:
      - runId
    DiscoveryStopResponseDto:
      type: object
      properties:
        meta:
          type: array
          description: "Connector-defined metadata for this run, replayed by Core\
            \ on every subsequent lifecycle call — status, results, stream, stop,\
            \ resume and cancel — so the stateless connector can resolve its run state.\
            \ Serialized size is capped at 64 KB; Core fails the run outright if this\
            \ exceeds the cap."
          items:
            $ref: "#/components/schemas/MetadataAttribute"
    DiscoveryProgressDto:
      type: object
      description: "Run-level progress of a discovery run: the run-wide counters,\
        \ plus an optional per-resource breakdown."
      properties:
        processed:
          type: integer
          format: int64
          description: Number of items processed so far; omitted when the connector
            cannot report it
        totalEstimate:
          type: integer
          format: int64
          description: Estimated total number of items for the run; omitted when the
            connector cannot produce an estimate
        phase:
          type: string
          description: "Connector-defined free-text phase label (e.g. \"scanning\"\
            , \"enumerating\"); omitted when the connector has no phase concept"
        byResource:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/DiscoveryResourceProgressDto"
          propertyNames:
            $ref: "#/components/schemas/Resource"
    DiscoveryStatusResponseDto:
      type: object
      properties:
        state:
          $ref: "#/components/schemas/DiscoveryRunState"
          description: Current state of the discovery run
        progress:
          $ref: "#/components/schemas/DiscoveryProgressDto"
        highestSequence:
          type: integer
          format: int64
          description: "Run-wide highest item sequence assigned so far — never page-scoped.\
            \ Consumers must advance cursors only by item sequences actually received.\
            \ Item sequences start at 1, so 0 means the run has produced no items\
            \ yet."
          minimum: 0
      required:
      - highestSequence
      - state
    DiscoveryInitiateResponseDto:
      type: object
      properties:
        meta:
          type: array
          description: "Connector-defined metadata for this run, replayed by Core\
            \ on every subsequent lifecycle call — status, results, stream, stop,\
            \ resume and cancel — so the stateless connector can resolve its run state.\
            \ Serialized size is capped at 64 KB; Core fails the run outright if this\
            \ exceeds the cap."
          items:
            $ref: "#/components/schemas/MetadataAttribute"
        stoppable:
          type: boolean
          description: |-
            Whether this run can be stopped and later resumed.

            **Feature gate:** may only narrow the discoveryStopResume feature flag, never widen it — true without the flag advertised is a contract violation and Core clamps the run to not-stoppable.

            **Absent:** undeclared — Core gates on the flag alone.

            **Refresh:** each resume response replaces the value; omitting it reverts the run to flag-gating.

            **Runtime:** the connector may still refuse a stop past the point of no return.
    DiscoveryDrainRequestDto:
      type: object
      properties:
        runId:
          type: string
          format: uuid
          description: Discovery run identifier assigned by Core when the run was
            created
        meta:
          type: array
          description: "Connector-defined metadata returned in the original discovery\
            \ initiate/stop/resume response, replayed here so the stateless connector\
            \ can resolve its run state; absent on the initiate call itself, which\
            \ is the call that mints it. Serialized size is capped at 64 KB."
          items:
            $ref: "#/components/schemas/MetadataAttribute"
        attributes:
          type: array
          description: "Run-level attributes supplied when the discovery run was initiated;\
            \ optional, since a connector may define no run-level attributes at all."
          items:
            $ref: "#/components/schemas/RequestAttribute"
        resourceAttributes:
          type: object
          additionalProperties:
            type: array
            items:
              $ref: "#/components/schemas/RequestAttribute"
          description: "Per-resource attributes, keyed by resource code (e.g. \"certificates\"\
            , \"keys\"); optional, since a connector may define none."
          propertyNames:
            $ref: "#/components/schemas/Resource"
        afterSequence:
          type: integer
          format: int64
          default: 0
          description: "Cursor: return items with sequence greater than this value.\
            \ Item sequences are dense per run, so 0 requests items from the start\
            \ of the run."
          minimum: 0
        maxItems:
          type: integer
          format: int32
          description: Maximum number of items to return in this batch. The platform's
            tunneled transport caps a single response at 10 MiB; a connector MUST
            apply its own bound on the returned page when this is omitted.
          minimum: 1
        maxBytes:
          type: integer
          format: int64
          description: "Maximum serialized size, in bytes, of the items returned in\
            \ this batch. The platform's tunneled transport caps a single response\
            \ at 10 MiB (10485760 bytes); exceeding it is an unrecoverable run failure.\
            \ A connector MUST apply its own bound when this is omitted."
          maximum: 10485760
          minimum: 1
      required:
      - runId
    DiscoveryResultsResponseDto:
      type: object
      properties:
        items:
          type: array
          description: "Items discovered after the requested cursor, up to the batch\
            \ limits. A producer that means \"this page has no items\" MUST send an\
            \ explicit empty array; omitting the field is rejected rather than read\
            \ as \"no discoveries\"."
          items:
            $ref: "#/components/schemas/DiscoveredItemDto"
        highestSequence:
          type: integer
          format: int64
          description: "Run-wide highest item sequence assigned so far — never page-scoped.\
            \ Consumers must advance cursors only by item sequences actually received.\
            \ Item sequences start at 1, so 0 means the run has produced no items\
            \ yet."
          minimum: 0
        more:
          type: boolean
          description: True when the connector has additional items beyond this page
      required:
      - highestSequence
      - items
      - more
    DiscoveryInitiateRequestDto:
