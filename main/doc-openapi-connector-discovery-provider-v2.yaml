    DiscoveredCertificateDto:
      type: object
      properties:
        resource:
          $ref: "#/components/schemas/Resource"
        certificateData:
          type: string
          description: Base64-encoded certificate data (DER)
          minLength: 1
      required:
      - certificateData
      - resource
    DiscoveredItemDto:
      type: object
      properties:
        sequence:
          type: integer
          format: int64
          description: "Dense per-run item sequence (1, 2, 3, ... with no holes);\
            \ the drain/stream cursor value after which the next batch starts"
          minimum: 1
        uniqueRef:
          type: string
          description: Connector-side natural key that Core uses to dedupe this item
            across drains and retries
          minLength: 1
        payload:
          $ref: "#/components/schemas/DiscoveredItemPayload"
          description: Resource-specific payload; its concrete type is selected by
            resource
        meta:
          type: array
          description: "Item metadata (platform convention). Where an item was found\
            \ (e.g. IP and port, file path, HSM slot) belongs here as typed, labeled\
            \ entries, never in payload."
          items:
            $ref: "#/components/schemas/MetadataAttribute"
        discoveredAt:
          type: string
          format: date-time
          description: Timestamp at which the connector discovered this item
      required:
      - payload
      - sequence
      - uniqueRef
    DiscoveredItemPayload:
      type: object
      description: "Resource-specific payload of a discovered item. The required resource\
        \ property is the discriminator: it carries the resource's wire code and selects\
        \ which concrete payload shape this object is. Each concrete shape fixes it\
        \ to its own value."
      discriminator:
        propertyName: resource
        mapping:
          certificates: "#/components/schemas/DiscoveredCertificateDto"
          keys: "#/components/schemas/DiscoveredKeyDto"
      oneOf:
      - $ref: "#/components/schemas/DiscoveredCertificateDto"
      - $ref: "#/components/schemas/DiscoveredKeyDto"
      required:
      - resource
    DiscoveredKeyDto:
      type: object
      description: "A connector reports a key's existence, intrinsic metadata, and\
        \ at most its public part; private, secret and split key material must never\
        \ be sent. A PRIVATE_KEY, SECRET_KEY or SPLIT_KEY report MUST omit publicKey\
        \ and publicKeyFormat entirely."
      properties:
        resource:
          $ref: "#/components/schemas/Resource"
        type:
          $ref: "#/components/schemas/KeyType"
          description: "Key type: whether this is a public, private, secret, or split\
            \ key"
        algorithm:
          $ref: "#/components/schemas/KeyAlgorithm"
          description: Cryptographic algorithm of the key
        length:
          type: integer
          format: int32
          description: Key length in bits
        fingerprint:
          type: string
          description: "Intrinsic key fingerprint; correlates the same key across\
            \ runs, connectors, and certificates without exposing key material"
        publicKeyFormat:
          $ref: "#/components/schemas/KeyFormat"
          description: Format of publicKey when present (typically SubjectPublicKeyInfo);
            absent when publicKey is absent
        publicKey:
          type: string
          description: "Base64-encoded public key material. Absent for PRIVATE_KEY,\
            \ SECRET_KEY or SPLIT_KEY discoveries, where only existence and intrinsic\
            \ metadata are ever reported"
      required:
      - algorithm
      - resource
      - type
    DiscoveryErrorEvent:
