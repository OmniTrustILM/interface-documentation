      - type
    DiscoveryProgressEvent:
      type: object
      properties:
        processed:
          type: integer
          format: int64
          description: Number of items processed so far; omitted when the connector
            cannot report it
        totalEstimate:
          type: integer
          format: int64
          description: Estimated total number of items for the run; omitted when the
            connector cannot produce an estimate
        phase:
          type: string
          description: "Connector-defined free-text phase label (e.g. \"scanning\"\
            , \"enumerating\"); omitted when the connector has no phase concept"
        byResource:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/DiscoveryResourceProgressDto"
          propertyNames:
            $ref: "#/components/schemas/Resource"
        type:
          $ref: "#/components/schemas/DiscoveryEventType"
      required:
      - type
    DiscoveryResourceProgressDto:
      type: object
      description: "Progress counters. Used for a whole run and, keyed by resource\
        \ code inside byResource (e.g. \"certificates\", \"keys\"), for one resource\
        \ type at a time. Every field is optional."
      properties:
        processed:
          type: integer
          format: int64
          description: Number of items processed so far; omitted when the connector
            cannot report it
        totalEstimate:
          type: integer
          format: int64
          description: Estimated total number of items for the run; omitted when the
            connector cannot produce an estimate
        phase:
          type: string
          description: "Connector-defined free-text phase label (e.g. \"scanning\"\
            , \"enumerating\"); omitted when the connector has no phase concept"
    DiscoveryResultBatchEvent:
      type: object
      properties:
        type:
          $ref: "#/components/schemas/DiscoveryEventType"
        items:
          type: array
          description: "Discovered items in this batch, each carrying its own per-run\
            \ sequence. A producer that means \"this batch has no items\" MUST send\
            \ an explicit empty array; omitting the field is rejected rather than\
            \ read as \"no discoveries\"."
          items:
            $ref: "#/components/schemas/DiscoveredItemDto"
      required:
      - items
      - type
    DiscoveryRunState:
      type: string
      enum:
      - running
      - stopped
      - completed
      - failed
      - cancelled
    DiscoveryStateChangedEvent:
      type: object
      properties:
        type:
          $ref: "#/components/schemas/DiscoveryEventType"
        state:
          $ref: "#/components/schemas/DiscoveryRunState"
          description: "Run state the connector is reporting; advisory, not authoritative"
      required:
