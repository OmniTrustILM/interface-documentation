  /v1/protocols/.well-known/est/serverkeygen:
    post:
      tags:
      - EST operations
      summary: Enroll with a server-generated key
      description: "The certificate request supplies the subject and requested extensions.\
        \ Without keyRecovery the generated key has the type and size of the request's\
        \ public key; with keyRecovery the EST Profile's key attributes decide. The\
        \ key value and the signature are ignored. The private key is returned without\
        \ additional encryption. The operation never answers 202: it waits for the\
        \ certificate and answers 503 when it is not issued in time"
      externalDocs:
        description: "RFC 7030, section 4.4"
        url: https://www.rfc-editor.org/rfc/rfc7030#section-4.4
      operationId: estServerKeyGeneration
      parameters: []
      requestBody:
        content:
          application/pkcs10:
            schema:
              type: string
              description: Base64-encoded DER PKCS#10 certification request
        required: true
      responses:
        "200":
          description: Private key and issued certificate
          content:
            multipart/mixed:
              schema:
                type: string
                description: Base64-encoded PKCS#8 private key part and certs-only
                  CMS part
        "400":
          description: "The request is not a base64-encoded DER PKCS#10 certification\
            \ request, it does not meet the policy of the RA Profile (the answer adds\
            \ the reason), or it asks for an encrypted key (Encrypted key delivery\
            \ is not supported.)"
          content:
            text/plain:
              schema:
                type: string
        "401":
          description: "Authentication is required, or under certificateRegistration\
            \ the request does not match an active certificate registration"
          headers:
            WWW-Authenticate:
              description: Basic challenge
              style: simple
              schema:
                type: string
          content:
            text/plain:
              schema:
                type: string
        "403":
          description: "The client certificate is not accepted, the request does not\
            \ match the client certificate, the certificate request was rejected,\
            \ the EST Profile does not generate keys (Server-side key generation is\
            \ not enabled.), or the RA Profile asks for an approval (Server-side key\
            \ generation is not available for this route.)"
          content:
            text/plain:
              schema:
                type: string
        "404":
          description: No EST service for the label (Not found.)
          content:
            text/plain:
              schema:
                type: string
        "405":
          description: The operation does not accept the HTTP method (The method is
            not allowed for this operation.)
          headers:
            Allow:
              description: The method the operation accepts
              style: simple
              schema:
                type: string
          content:
            text/plain:
              schema:
                type: string
        "413":
          description: The request is too large.
          content:
            text/plain:
              schema:
                type: string
        "415":
          description: The content type must be application/pkcs10.
          content:
            text/plain:
              schema:
                type: string
        "500":
          description: The request could not be processed.
          content:
            text/plain:
              schema:
                type: string
        "503":
          description: "The service is temporarily unavailable, the certificate could\
            \ not be issued (The certificate could not be issued. Try again later.),\
            \ or it was not issued within the time the client waits (The certificate\
            \ could not be issued in time.)"
          content:
            text/plain:
              schema:
                type: string
      security: []
