      - CertificateAuth: []
      - BearerJWTAuth: []
  /v1/certificates/{uuid}/keystore:
    post:
      tags:
      - Certificate Inventory
      summary: Download a certificate with its private key
      description: |
        Download a certificate, its chain and its private key as one PKCS#12 file.

        This is a POST because the passphrase travels in the body: a URL is recorded by proxies, browser history
        and access logs, so a passphrase must never appear in one. The response is not cacheable and carries a
        sanitized download filename.

        It is a separate operation from the certificate content download, which serves certificates only. Only a
        key created or imported as exportable can be included.
      operationId: downloadKeystore
      parameters:
      - name: uuid
        in: path
        description: Certificate UUID
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CertificateKeystoreRequestDto"
        required: true
      responses:
        "200":
          description: Keystore downloaded
          headers:
            Cache-Control:
              description: "`no-store, no-cache`, so the file is not written to any\
                \ cache"
              required: true
              style: simple
              schema:
                type: string
            X-Content-Type-Options:
              description: '`nosniff`'
              required: true
              style: simple
              schema:
                type: string
            Content-Disposition:
              description: "Attachment with a sanitized filename, as RFC 6266 describes"
              required: true
              style: simple
              schema:
                type: string
            Pragma:
              description: "`no-cache`, for caches that predate `Cache-Control`"
              required: true
              style: simple
              schema:
                type: string
          content:
            application/x-pkcs12:
              schema:
                type: string
                format: binary
        "404":
          description: Not Found
          content:
            application/x-pkcs12:
              schema:
                $ref: "#/components/schemas/ErrorMessageDto"
        "422":
          description: Unprocessable Entity
          content:
            application/x-pkcs12:
              schema:
                type: array
                items:
                  type: string
              example:
              - Error Message 1
              - Error Message 2
        "400":
          description: Bad Request
          content:
            application/x-pkcs12:
              schema:
                $ref: "#/components/schemas/ErrorMessageDto"
        "401":
          description: Unauthorized
        "403":
          description: Forbidden
          content:
            application/x-pkcs12:
              schema:
                $ref: "#/components/schemas/AuthenticationServiceExceptionDto"
        "500":
          description: Internal Server Error
      security:
      - SessionAuth: []
      - CertificateAuth: []
      - BearerJWTAuth: []
