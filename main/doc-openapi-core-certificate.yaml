    CertificateEntryKeyDestinationDto:
      type: object
      description: Token profile and naming for key material imported with a certificate
      properties:
        tokenProfileUuid:
          type: string
          description: Token profile that will hold the imported key material
          minLength: 1
        keyName:
          type: string
          description: Name for the imported key. The platform derives one from the
            certificate when this is absent.
        exportable:
          type: boolean
          default: false
          description: |
            Whether the imported key may later be exported. Defaults to false, and false is final. It can only be
            requested where the token profile reports key export as available for the key type.
        importAttributes:
          type: array
          description: "Attributes required by the provider to import a key, from\
            \ the import attribute schema"
          items:
            $ref: "#/components/schemas/RequestAttribute"
        customAttributes:
          type: array
          description: Custom attributes for the imported key. A key that arrives
            inside a container carries the same custom attributes as one imported
            on its own.
          items:
            $ref: "#/components/schemas/RequestAttribute"
      required:
      - tokenProfileUuid
    CertificateImportEntryDto:
      type: object
      description: An entry to import and the destination of its key material
      properties:
        entryReference:
          type: string
          description: "Reference of the entry to import, derived from the entry's\
            \ own content. Read the file first to learn it, or compute it from content\
            \ already held."
          minLength: 1
        importId:
          type: string
          description: |
            Identifier of this entry's import, so a retry cannot import the same entry twice.

            A replay is the same import only when this entry's reference and destination match the first submission,
            and the file carries the same content for it. A replay returns what that entry produced the first time;
            reuse with anything else changed is refused.

            The identifier is per entry rather than per request because entries succeed and fail on their own.
            Repeating a request whose entries partly failed returns what already succeeded and retries only what did
            not, without the caller having to work out which is which.
          maxLength: 256
          minLength: 1
        keyDestination:
          $ref: "#/components/schemas/CertificateEntryKeyDestinationDto"
          description: "Where this entry's key material is stored. Required when the\
            \ entry carries key material, and refused for an entry that carries only\
            \ a certificate."
      required:
      - entryReference
      - importId
    CertificateImportRequestDto:
      type: object
      description: "The file to import from, the entries to import, and where their\
        \ key material goes"
      properties:
        file:
          type: string
          format: byte
          description: |
            Content of the uploaded file, base64-encoded: a container such as PKCS#12 or PEM, a standalone key, or a
            certificate. At most 5 MiB decoded. The platform holds it in memory only, never writes it anywhere and
            never echoes it in an error, since the file may carry key material.
          maxLength: 6990508
          writeOnly: true
        passphrase:
          type: string
          format: password
          description: Passphrase that opens the uploaded file. Absent for a file
            that carries no protection of its own.
          writeOnly: true
        entries:
          type: array
          description: |
            Entries to import. Nothing else in the file is touched, so an import can never take in material the caller
            did not ask for.

            An entry is named by the reference the inspection reported, which is derived from the entry's own content:
            a certificate fingerprint, a public key fingerprint, or a digest of the protected key. A caller that
            already knows what it is importing can compute the reference itself and never read the file first.
          items:
            $ref: "#/components/schemas/CertificateImportEntryDto"
          minItems: 1
        customAttributes:
          type: array
          description: Custom attributes for the imported certificates
          items:
            $ref: "#/components/schemas/RequestAttribute"
      required:
      - entries
      - file
