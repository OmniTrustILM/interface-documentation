          - $ref: "#/components/schemas/RdnAttributeTypeOidPropertiesDto"
        oid:
          type: string
          description: "Object Identifier (OID) in dot notation (e.g., 1.2.840.113549.1.1.1)"
          example: 1.2.840.113549.1.1.1
          minLength: 1
          pattern: "^([01]\\.(\\d|[1-3]\\d)|2\\.(0|[1-9]\\d*))(\\.(0|[1-9]\\d*)){0,49}$"
