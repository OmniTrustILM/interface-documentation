    CbomDetailDto:
      type: object
      properties:
        uuid:
          type: string
          format: uuid
          description: UUID of a CBOM record
        createdAt:
          type: string
          format: date-time
          description: Creation timestamp of CBOM database record
        serialNumber:
          type: string
          description: CBOM serial number (URN)
        version:
          type: integer
          format: int32
          description: CBOM version
        specVersion:
          type: string
          description: CBOM spec version
        timestamp:
          type: string
          format: date-time
          description: A timestamp from CBOM metadata
        source:
          type: string
          description: "CBOM source (e.g.: CBOM-Lens)"
        algorithms:
          type: integer
          format: int32
          description: Number of algorithms
        certificates:
          type: integer
          format: int32
          description: Number of certificates
        protocols:
          type: integer
          format: int32
          description: Number of protocols
        cryptoMaterial:
          type: integer
          format: int32
          description: Number of crypto material items
        totalAssets:
          type: integer
          format: int32
          description: Total number of assets
        assetSyncState:
          $ref: "#/components/schemas/CbomAssetSyncState"
          description: State of the cryptographic asset sync for this CBOM record;
            pending until the first sync attempt considers it. Platform versions predating
            the asset sync omit the field.
        assetSyncedAt:
          type: string
          format: date-time
          description: When this record last successfully reached the synced state;
            later failed attempts neither advance nor clear it. Platform versions
            predating the asset sync omit the field.
        attributeValues:
          type: object
          additionalProperties:
            type: object
            additionalProperties:
              type: array
              items:
                $ref: "#/components/schemas/BaseAttributeContentDtoV3"
          description: "Values of the attribute-sourced fields requested as columns,\
            \ keyed by field source and then by field identifier. Present only when\
            \ the listing request asked for attribute-sourced columns; a field the\
            \ object has no value for is absent rather than empty, and a multi-valued\
            \ attribute arrives in its stored item_order."
        content:
          type: object
          additionalProperties: {}
          description: Raw JSON content of CBOM document
      required:
      - algorithms
      - certificates
      - content
      - createdAt
      - cryptoMaterial
      - protocols
      - serialNumber
      - source
      - specVersion
      - timestamp
      - totalAssets
      - uuid
      - version
    PublicBrandingDto:
      type: object
      properties:
        configured:
          type: boolean
          description: "Whether the operator has configured branding. When false,\
            \ every colour and logo field is null, defaultTheme is absent, and a client\
            \ applies the platform's own themes."
        primaryColor:
          type:
          - string
          - "null"
          description: "Primary brand color, used for the header and for solid interactive\
            \ elements"
          examples:
          - "#0073CF"
        secondaryColor:
          type:
          - string
          - "null"
          description: "Secondary brand color, used as an accent"
          examples:
          - "#00A3E0"
        backgroundColor:
          type:
          - string
          - "null"
          description: Page background color of the branded theme
          examples:
          - "#FFFFFF"
        textColor:
          type:
          - string
          - "null"
          description: Body text color of the branded theme
          examples:
          - "#171717"
        lightLogo:
          type:
          - string
          - "null"
          description: "Logo shown by the branded light theme, as a base64 data URI"
          examples:
          - "data:image/png;base64,iVBORw0KGgo="
        darkLogo:
          type:
          - string
          - "null"
          description: "Logo shown by the branded dark theme, as a base64 data URI"
          examples:
          - "data:image/svg+xml;base64,PHN2Zy8+"
        defaultTheme:
          $ref: "#/components/schemas/BrandingTheme"
          description: Branded theme applied when the user has expressed no preference
            of their own. Absent when branding is not configured.
      required:
      - backgroundColor
      - configured
      - darkLogo
      - lightLogo
      - primaryColor
      - secondaryColor
      - textColor
    BulkActionMessageDto:
      type: object
      properties:
        uuid:
          type: string
          description: Object identifier
          examples:
          - 7b55ge1c-844f-11dc-a8a3-0242ac120002
        name:
          type: string
          description: Object Name
          examples:
          - Name
        message:
          type: string
          description: Message describing the associations of the objects that are
            preventing the bulk operation
          examples:
          - Object is associated with other items
      required:
      - message
      - name
      - uuid
