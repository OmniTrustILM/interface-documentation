    SigningRecordStatisticsDto:
      type: object
      description: Signing Records dashboard statistics
      properties:
        totalRetained:
          type: integer
          format: int64
          description: Total signing records currently retained (across the retention
            window)
        countLast24h:
          type: integer
          format: int64
          description: "Signings performed in the last 24 hours, including those whose\
            \ records have since been deleted. History is kept per hour, so the window\
            \ opens at the start of the hour rather than 24 hours to the second."
        countLast7d:
          type: integer
          format: int64
          description: "Signings performed in the last 7 days, including those whose\
            \ records have since been deleted. History is kept per hour, so the window\
            \ opens at the start of the hour rather than 7 days to the second."
        activeProfileCount:
          type: integer
          format: int64
          description: Number of distinct signing profiles that produced at least
            one retained record
        distinctRequesterCount:
          type: integer
          format: int64
          description: Number of distinct requesters that produced at least one retained
            record. Lets the client render a "+k more" overflow beyond the top-N entries
            in statByRequester.
        volumeOverTime:
          type: object
          additionalProperties:
            type: integer
            format: int64
          description: "Signing volume over the requested period, including signings\
            \ whose records have since been deleted. Ordered map of bucket start to\
            \ count, keyed by ISO-8601 UTC instant (hourly buckets for the 24h period,\
            \ daily otherwise). Buckets are dense: every bucket in the window is present,\
            \ with 0 for buckets that had no signings."
        statByProfile:
          type: object
          additionalProperties:
            type: integer
            format: int64
          description: Retained record count by signing profile name
        statByRequester:
          type: object
          additionalProperties:
            type: integer
            format: int64
          description: "Retained record count by requester username, limited to the\
            \ top-N requesters by count. Use distinctRequesterCount for the total.\
            \ Records with no requester are grouped under \"Unassigned\"."
        statByWorkflowType:
          type: object
          additionalProperties:
            type: integer
            format: int64
          description: Retained record count by signing workflow type. Keys are SigningWorkflowType
            codes.
        statByProtocol:
          type: object
          additionalProperties:
            type: integer
            format: int64
          description: "Retained record count by signing protocol. Keys are SigningProtocol\
            \ codes, grouped on the protocol persisted on each record at signing time."
        statByScheme:
          type: object
          additionalProperties:
            type: integer
            format: int64
          description: "Retained record count by signing scheme, flattened as the\
            \ cross-product of signing scheme and managed signing type: 'delegated',\
            \ 'managed_static_key', 'managed_one_time_key' (and more later)."
    CryptographicAssetStatisticsDto:
      type: object
