  /v1/settings/platform/branding:
    get:
      tags:
      - Settings
      summary: Get platform branding
      description: "Reads the branding category of the platform settings. Branding\
        \ is also returned by `GET /v1/settings/platform`; only the write is split\
        \ onto a dedicated endpoint, because reading it takes the same grant either\
        \ way."
      operationId: getBrandingSettings
      responses:
        "200":
          description: Platform branding retrieved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BrandingSettingsDto"
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessageDto"
        "401":
          description: Unauthorized
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthenticationServiceExceptionDto"
        "500":
          description: Internal Server Error
      security:
      - SessionAuth: []
      - CertificateAuth: []
      - BearerJWTAuth: []
    put:
      tags:
      - Settings
      summary: Update platform branding
      description: |-
        The only way to write branding.

        **Authorization:** gated by `UPDATE_BRANDING`, a narrower action than the `UPDATE` that gates the rest of settings. Authorization is applied per endpoint. Branding is therefore deliberately absent from the `PUT /v1/settings/platform` body. Carried there, it would be writable by anyone holding plain `UPDATE`, leaving `UPDATE_BRANDING` nothing extra to grant.

        **Request semantics:** the request carries the full desired state. A field left out clears that part of the branding.
      operationId: updateBrandingSettings
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BrandingSettingsUpdateDto"
        required: true
      responses:
        "204":
          description: Platform branding updated
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessageDto"
        "401":
          description: Unauthorized
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthenticationServiceExceptionDto"
        "500":
          description: Internal Server Error
      security:
      - SessionAuth: []
      - CertificateAuth: []
      - BearerJWTAuth: []
