          description: "Asset count by asset type. Keys are CryptographicAssetType\
            \ codes; every type is present, with 0 when none"
        statByPqcVerdict:
          type: object
          additionalProperties:
            type: integer
            format: int64
          description: "Asset count by PQC readiness verdict. Keys are PqcVerdict\
            \ codes; every verdict is present, with 0 when none"
        statByAlgorithmFamily:
          type: object
          additionalProperties:
            type: integer
            format: int64
          description: "Asset count by algorithm family, limited to the top-N families\
            \ by count. Use distinctAlgorithmFamilyCount for the total number of families;\
            \ assets with no family are counted in unassignedAssetCount and never\
            \ occupy a slot here"
        distinctAlgorithmFamilyCount:
          type: integer
          format: int64
          description: "Number of distinct algorithm families across the inventory,\
            \ excluding assets with no family. Lets the client render a \"+k more\"\
