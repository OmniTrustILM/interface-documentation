          format: int32
          default: 1
          description: Minimum number of NTP servers that must be reachable
          example: 1
        maxClockDrift:
          type: string
          description: "Maximum allowed clock drift from NTP reference time, in ISO\
            \ 8601 duration format"
          example: PT500MS
        leapSecondGuard:
          type: boolean
          default: true
          description: Whether to guard against leap second anomalies
          example: true
